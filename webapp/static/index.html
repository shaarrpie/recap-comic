<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>recap-comic</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 1200px; margin: 0 auto; padding: 24px;
      background: #f7f7f9; color: #1a1a1a;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .subtitle { color: #666; margin-bottom: 1.5rem; }
    .card {
      background: #fff; border: 1px solid #e0e0e0; border-radius: 12px;
      padding: 24px; margin-bottom: 24px;
    }
    .dropzone {
      border: 2px dashed #ccc; border-radius: 12px; padding: 40px;
      text-align: center; color: #888; cursor: pointer; transition: 0.2s;
    }
    .dropzone.over { border-color: #4f46e5; background: #eef2ff; color: #4f46e5; }
    .dropzone input { display: none; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
    select, button, input[type="text"], input[type="password"] {
      padding: 10px 16px; border-radius: 8px; border: 1px solid #d0d0d0;
      font-size: 1rem; cursor: pointer;
    }
    button { background: #4f46e5; color: #fff; border-color: #4f46e5; }
    button:disabled { background: #a5a5a5; border-color: #a5a5a5; cursor: not-allowed; }
    .status {
      margin-top: 16px; padding: 12px 16px; border-radius: 8px;
      background: #f0f0f0; font-family: ui-monospace, monospace;
    }
    .status.running { background: #eef2ff; color: #1e3a8a; }
    .status.done { background: #ecfdf5; color: #064e3b; }
    .status.error { background: #fef2f2; color: #7f1d1d; }
    .stepper {
      display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .step {
      padding: 6px 12px; border-radius: 6px; background: #f0f0f0;
      font-size: 0.85rem; color: #666;
    }
    .step.active { background: #4f46e5; color: #fff; }
    .step.done { background: #10b981; color: #fff; }
    .step.error { background: #ef4444; color: #fff; }
    .gallery {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px; margin-top: 16px;
    }
    .panel {
      background: #fff; border: 1px solid #e0e0e0; border-radius: 10px;
      overflow: hidden;
    }
    .panel img {
      width: 100%; height: 260px; object-fit: cover; display: block;
      background: #e5e5e5;
    }
    .panel .meta { padding: 10px 12px; font-size: 0.85rem; }
    .panel .meta b { display: block; margin-bottom: 4px; }
    .panel .meta .tag {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      background: #f0f0f0; font-size: 0.75rem; margin: 2px 4px 2px 0;
    }
    .panel .meta .conf { color: #666; font-size: 0.75rem; }
    .panel .meta .conf.low { color: #b45309; background: #fef3c7; padding: 2px 6px; border-radius: 4px; }
    .actions { margin-top: 12px; }
    .actions a {
      display: inline-block; padding: 8px 12px; border-radius: 6px;
      background: #f0f0f0; color: #1a1a1a; text-decoration: none;
      font-size: 0.85rem; margin-right: 8px;
    }
    .actions a:hover { background: #e0e0e0; }
    .empty { color: #888; font-style: italic; }
    .settings-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px; margin-top: 12px;
    }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 0.85rem; color: #555; }
    .field input, .field select { padding: 8px 10px; font-size: 0.95rem; }
    .api-keys {
      margin-top: 12px; padding: 12px; border-radius: 8px; background: #f8f8f8;
      border: 1px solid #e0e0e0;
    }
    .api-keys summary { cursor: pointer; font-weight: 600; }
    .api-keys .row { margin-top: 8px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>recap-comic</h1>
  <p class="subtitle">AI-guided panel segmentation and narration for manhwa/webtoon strips.</p>

  <div class="card">
    <div class="dropzone" id="dropzone">
      <input type="file" id="file" accept="image/png,image/jpeg,image/webp" multiple>
      <div id="drop-label">Drop tall strip images here, or click to choose<br><small>(multiple files supported)</small></div>
    </div>
    <div class="settings-grid">
      <div class="field">
        <label>Backend</label>
        <select id="backend">
          <option value="cloudflare">cloudflare (free)</option>
          <option value="gemini">gemini</option>
          <option value="openai">openai</option>
          <option value="anthropic">anthropic</option>
          <option value="ollama">ollama</option>
          <option value="zai">zai (chat.z.ai cookies)</option>
          <option value="none">none (offline)</option>
        </select>
      </div>
      <div class="field">
        <label>TTS</label>
        <select id="tts">
          <option value="edge">edge-tts (cloud)</option>
          <option value="kokoro">kokoro (offline)</option>
          <option value="none">none (silent)</option>
        </select>
      </div>
      <div class="field">
        <label>Voice</label>
        <input type="text" id="voice" value="en-US-AriaNeural" placeholder="edge-tts voice id">
      </div>
      <div class="field">
        <label>Model</label>
        <input type="text" id="model" placeholder="auto">
      </div>
    </div>
    <div class="row">
      <button id="run" disabled>Run</button>
      <span id="file-count" class="empty"></span>
    </div>
    <details class="api-keys">
      <summary>Connection settings (stored locally in your browser only)</summary>
      <div class="settings-grid">
        <div class="field">
          <label>API Key</label>
          <input type="text" id="api-key" placeholder="optional for some backends">
        </div>
        <div class="field">
          <label>Endpoint / Base URL</label>
          <input type="text" id="endpoint" placeholder="optional — override default API URL">
        </div>
        <div class="field">
          <label>Cloudflare Account ID</label>
          <input type="text" id="cf-account-id" placeholder="required for cloudflare backend">
        </div>
        <div class="field">
          <label>Z AI Cookies</label>
          <input type="text" id="key-zai-cookies" placeholder="cookie string for chat.z.ai (zai backend)">
        </div>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="save-keys" type="button">Save locally</button>
        <button id="clear-keys" type="button" style="background:#666">Clear</button>
        <span id="key-status" class="empty"></span>
      </div>
    </details>
    <div class="status empty" id="status">Idle</div>
  </div>

  <div class="card" id="result" style="display:none">
    <div class="stepper" id="stepper">
      <div class="step" data-step="upload">Upload</div>
      <div class="step" data-step="phase1">Phase 1: AI plan</div>
      <div class="step" data-step="phase2">Phase 2: Cut</div>
      <div class="step" data-step="narration">Narration</div>
      <div class="step" data-step="done">Done</div>
    </div>
    <h2>Result</h2>
    <div id="summary"></div>
    <div class="actions" id="actions"></div>
    <div class="gallery" id="gallery"></div>
  </div>

  <script>
    function $(id) { return document.getElementById(id); }
    var dropzone = $('dropzone');
    var fileInput = $('file');
    var runBtn = $('run');
    var statusEl = $('status');
    var resultCard = $('result');
    var summaryEl = $('summary');
    var actionsEl = $('actions');
    var galleryEl = $('gallery');
    var stepper = $('stepper');
    var fileCountEl = $('file-count');

    var selectedFiles = null;

    function setStep(step) {
      stepper.querySelectorAll('.step').forEach(function(el) {
        var s = el.dataset.step;
        el.classList.remove('active', 'done', 'error');
        if (s === step) el.classList.add('active');
      });
    }
    function markStep(step, state) {
      var el = stepper.querySelector('.step[data-step="' + step + '"]');
      if (el) el.classList.add(state);
    }

    dropzone.addEventListener('click', function() { fileInput.click(); });
    dropzone.addEventListener('dragover', function(e) { e.preventDefault(); dropzone.classList.add('over'); });
    dropzone.addEventListener('dragleave', function() { dropzone.classList.remove('over'); });
    dropzone.addEventListener('drop', function(e) {
      e.preventDefault(); dropzone.classList.remove('over');
      if (e.dataTransfer.files.length) pick(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', function() {
      if (fileInput.files.length) pick(fileInput.files);
    });

    function pick(files) {
      selectedFiles = files;
      fileCountEl.textContent = files.length + ' file' + (files.length > 1 ? 's' : '') + ' selected';
      runBtn.disabled = false;
    }

    $('save-keys').addEventListener('click', function() {
      var keys = {};
      ['api-key','endpoint','model','cf-account-id','zai-cookies'].forEach(function(k) {
        var input = $('key-' + k);
        if (input && input.value.trim()) keys[k] = input.value.trim();
      });
      localStorage.setItem('recap-comic-keys', JSON.stringify(keys));
      $('key-status').textContent = 'saved';
      setTimeout(function() { $('key-status').textContent = ''; }, 2000);
    });
    $('clear-keys').addEventListener('click', function() {
      localStorage.removeItem('recap-comic-keys');
      ['api-key','endpoint','model','cf-account-id','zai-cookies'].forEach(function(k) {
        var input = $('key-' + k);
        if (input) input.value = '';
      });
      $('key-status').textContent = 'cleared';
    });
    (function() {
      try {
        var keys = JSON.parse(localStorage.getItem('recap-comic-keys') || '{}');
        if (keys['api-key']) $('key-api-key').value = keys['api-key'];
        if (keys['endpoint']) $('key-endpoint').value = keys['endpoint'];
        if (keys['model']) $('key-model').value = keys['model'];
        if (keys['cf-account-id']) $('key-cf-account-id').value = keys['cf-account-id'];
        if (keys['zai-cookies']) $('key-zai-cookies').value = keys['zai-cookies'];
      } catch(e) {}
    })();

    async function uploadOne(file, backend) {
      var form = new FormData();
      form.append('file', file);
      form.append('backend', backend);
      form.append('tts', $('tts').value);
      form.append('voice', $('voice').value);
      form.append('style', $('style').value);
      form.append('api_key', $('key-api-key').value);
      form.append('endpoint', $('key-endpoint').value);
      form.append('model', $('key-model').value);
      form.append('cf_account_id', $('key-cf-account-id').value);
      form.append('zai_cookies', $('key-zai-cookies').value);
      var res = await fetch('/api/upload', { method: 'POST', body: form });
      if (!res.ok) throw new Error((await res.text()) || 'upload failed');
      return await res.json();
    }

    runBtn.addEventListener('click', async function() {
      if (!selectedFiles || !selectedFiles.length) return;
      var backend = $('backend').value;
      var tts = $('tts').value;
      var voice = $('voice').value;
      var style = $('style').value;

      resultCard.style.display = 'none';
      galleryEl.innerHTML = '';
      actionsEl.innerHTML = '';
      statusEl.className = 'status running';
      statusEl.textContent = 'Uploading...';
      setStep('upload');

      try {
        var jobs = [];
        for (var i = 0; i < selectedFiles.length; i++) {
          statusEl.textContent = 'Uploading ' + (i + 1) + '/' + selectedFiles.length + '...';
          var j = await uploadOne(selectedFiles[i], backend);
          jobs.push(j);
        }
        markStep('upload', 'done');
        setStep('phase1');
        statusEl.textContent = 'Processing...';
        var first = jobs[0];
        poll(first.job_id, jobs.map(function(j) { return j.job_id; }));
      } catch (err) {
        statusEl.className = 'status error';
        statusEl.textContent = 'Upload failed: ' + err.message;
      }
    });

    async function poll(job_id, allJobIds) {
      var interval = setInterval(async function() {
        try {
          var res = await fetch('/api/status/' + job_id);
          if (!res.ok) throw new Error('job not found');
          var data = await res.json();
          var state = data.status === 'done' ? 'done' : (data.status === 'error' ? 'error' : 'running');
          statusEl.className = 'status ' + state;
          statusEl.textContent = data.message + (data.panels_count ? ' — ' + data.panels_count + ' panels' : '');

          if (state === 'done') {
            markStep('phase1', 'done');
            markStep('phase2', 'done');
            markStep('narration', 'done');
            markStep('done', 'done');
            clearInterval(interval);
            renderResult(job_id, data);
          } else if (state === 'error') {
            markStep(data.step || 'phase1', 'error');
            clearInterval(interval);
          } else {
            if (data.step === 'phase1') setStep('phase1');
            else if (data.step === 'narration') { markStep('phase2', 'done'); setStep('narration'); }
            else setStep('phase2');
          }
        } catch (err) {
          clearInterval(interval);
          statusEl.className = 'status error';
          statusEl.textContent = 'Lost connection to server.';
        }
      }, 1000);
    }

    function renderResult(job_id, data) {
      resultCard.style.display = 'block';
      summaryEl.innerHTML = '<b>' + data.panels_count + ' panels</b> · model: ' + (data.model || '—') + ' · provenance: ' + (data.provenance || '—') + ' · used fallback: ' + (data.used_fallback ? 'yes' : 'no');

      var links = [];
      if (data.plan_path) links.push('<a href="/api/download/' + job_id + '/' + data.plan_path.split('/').pop() + '" download>plan.json</a>');
      if (data.narration_path) links.push('<a href="/api/download/' + job_id + '/' + data.narration_path.split('/').pop() + '" download>narration.txt</a>');
      actionsEl.innerHTML = links.join('') || '<span class="empty">no downloads yet</span>';

      galleryEl.innerHTML = '';
      var panels = data.panels || [];
      for (var i = 0; i < panels.length; i++) {
        var p = panels[i];
        var el = document.createElement('div');
        el.className = 'panel';
        var confPct = (p.confidence * 100).toFixed(0);
        var confClass = p.confidence < 0.5 ? 'low' : '';
        el.innerHTML = '<img src="/api/download/' + job_id + '/' + p.image_file + '" alt="panel ' + p.id + '" loading="lazy">' +
          '<div class="meta"><b>#' + p.id + '</b>' +
          '<span class="tag">' + p.panel_type + '</span>' +
          '<span class="tag conf ' + confClass + '">' + confPct + '%</span>' +
          '<div style="margin-top:6px; color:#444">' + escapeHtml(p.narration || p.dialogue || '(no text)') + '</div>' +
          '</div>';
        galleryEl.appendChild(el);
      }
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, function(c) {
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c] || c;
      });
    }
  </script>
</body>
</html>
