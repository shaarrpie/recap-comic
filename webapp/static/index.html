<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>recap-comic</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 1200px; margin: 0 auto; padding: 24px;
      background: #f7f7f9; color: #1a1a1a;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .subtitle { color: #666; margin-bottom: 1.5rem; }
    .card {
      background: #fff; border: 1px solid #e0e0e0; border-radius: 12px;
      padding: 24px; margin-bottom: 24px;
    }
    .dropzone {
      border: 2px dashed #ccc; border-radius: 12px; padding: 40px;
      text-align: center; color: #888; cursor: pointer; transition: 0.2s;
    }
    .dropzone.over { border-color: #4f46e5; background: #eef2ff; color: #4f46e5; }
    .dropzone input { display: none; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    select, button {
      padding: 10px 16px; border-radius: 8px; border: 1px solid #d0d0d0;
      font-size: 1rem; cursor: pointer;
    }
    button { background: #4f46e5; color: #fff; border-color: #4f46e5; }
    button:disabled { background: #a5a5a5; border-color: #a5a5a5; cursor: not-allowed; }
    .status {
      margin-top: 16px; padding: 12px 16px; border-radius: 8px;
      background: #f0f0f0; font-family: ui-monospace, monospace;
    }
    .status.running { background: #eef2ff; color: #1e3a8a; }
    .status.done { background: #ecfdf5; color: #064e3b; }
    .status.error { background: #fef2f2; color: #7f1d1d; }
    .gallery {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px; margin-top: 16px;
    }
    .panel {
      background: #fff; border: 1px solid #e0e0e0; border-radius: 10px;
      overflow: hidden;
    }
    .panel img {
      width: 100%; height: 260px; object-fit: cover; display: block;
      background: #e5e5e5;
    }
    .panel .meta { padding: 10px 12px; font-size: 0.85rem; }
    .panel .meta b { display: block; margin-bottom: 4px; }
    .panel .meta .tag {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      background: #f0f0f0; font-size: 0.75rem; margin: 2px 4px 2px 0;
    }
    .panel .meta .conf { color: #666; font-size: 0.75rem; }
    .actions { margin-top: 12px; }
    .actions a {
      display: inline-block; padding: 8px 12px; border-radius: 6px;
      background: #f0f0f0; color: #1a1a1a; text-decoration: none;
      font-size: 0.85rem; margin-right: 8px;
    }
    .actions a:hover { background: #e0e0e0; }
    .empty { color: #888; font-style: italic; }
  </style>
</head>
<body>
  <h1>recap-comic</h1>
  <p class="subtitle">AI-guided panel segmentation and narration for manhwa/webtoon strips.</p>

  <div class="card">
    <div class="dropzone" id="dropzone">
      <input type="file" id="file" accept="image/png,image/jpeg,image/webp">
      <div id="drop-label">Drop a tall strip image here, or click to choose</div>
    </div>
    <div class="row" style="margin-top:12px">
      <label>Backend
        <select id="backend">
          <option value="cloudflare">cloudflare (free)</option>
          <option value="gemini">gemini</option>
          <option value="openai">openai</option>
          <option value="anthropic">anthropic</option>
          <option value="ollama">ollama</option>
          <option value="none">none (offline)</option>
        </select>
      </label>
      <button id="run" disabled>Run</button>
    </div>
    <div class="status empty" id="status">Idle</div>
  </div>

  <div class="card" id="result" style="display:none">
    <h2>Result</h2>
    <div id="summary"></div>
    <div class="actions" id="actions"></div>
    <div class="gallery" id="gallery"></div>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file');
    const runBtn = document.getElementById('run');
    const statusEl = document.getElementById('status');
    const resultCard = document.getElementById('result');
    const summaryEl = document.getElementById('summary');
    const actionsEl = document.getElementById('actions');
    const galleryEl = document.getElementById('gallery');

    let selectedFile: File | null = null;

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', e => {
      e.preventDefault(); dropzone.classList.add('over');
    });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('over'));
    dropzone.addEventListener('drop', e => {
      e.preventDefault(); dropzone.classList.remove('over');
      if (e.dataTransfer.files.length) pick(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) pick(fileInput.files[0]);
    });

    function pick(f: File) {
      selectedFile = f;
      document.getElementById('drop-label').textContent = f.name;
      runBtn.disabled = false;
    }

    runBtn.addEventListener('click', async () => {
      if (!selectedFile) return;
      const backend = document.getElementById('backend').value;
      const form = new FormData();
      form.append('file', selectedFile);
      form.append('backend', backend);

      resultCard.style.display = 'none';
      galleryEl.innerHTML = '';
      actionsEl.innerHTML = '';
      statusEl.className = 'status running';
      statusEl.textContent = 'Uploading...';

      try {
        const upload = await fetch('/api/upload', {
          method: 'POST', body: form,
        });
        if (!upload.ok) throw new Error((await upload.text()) || 'upload failed');
        const { job_id } = await upload.json();
        poll(job_id);
      } catch (err) {
        statusEl.className = 'status error';
        statusEl.textContent = 'Upload failed: ' + (err as Error).message;
      }
    });

    async function poll(job_id: string) {
      const interval = setInterval(async () => {
        try {
          const res = await fetch(`/api/status/${job_id}`);
          if (!res.ok) throw new Error('job not found');
          const data = await res.json();
          statusEl.className = 'status ' + (data.status === 'done' ? 'done' : data.status === 'error' ? 'error' : 'running');
          statusEl.textContent = `${data.message}${data.panels_count ? ' — ' + data.panels_count + ' panels' : ''}`;
          if (data.status === 'done') {
            clearInterval(interval);
            renderResult(job_id, data);
          } else if (data.status === 'error') {
            clearInterval(interval);
          }
        } catch (err) {
          clearInterval(interval);
          statusEl.className = 'status error';
          statusEl.textContent = 'Lost connection to server.';
        }
      }, 1000);
    }

    function renderResult(job_id: string, data: any) {
      resultCard.style.display = 'block';
      summaryEl.innerHTML = `
        <b>${data.panels_count} panels</b> ·
        model: ${data.model || '—'} ·
        provenance: ${data.provenance || '—'} ·
        used fallback: ${data.used_fallback ? 'yes' : 'no'}
      `;
      const links = [
        data.plan_path ? `<a href="/api/download/${job_id}/${data.plan_path.split('/').pop()}" download>plan.json</a>` : '',
        data.narration_path ? `<a href="/api/download/${job_id}/${data.narration_path.split('/').pop()}" download>narration.txt</a>` : '',
      ].filter(Boolean).join('');
      actionsEl.innerHTML = links || '<span class="empty">no downloads yet</span>';

      galleryEl.innerHTML = '';
      for (const p of (data.panels || [])) {
        const el = document.createElement('div');
        el.className = 'panel';
        el.innerHTML = `
          <img src="/api/download/${job_id}/${p.image_file}" alt="panel ${p.id}" loading="lazy">
          <div class="meta">
            <b>#${p.id}</b>
            <span class="tag">${p.panel_type}</span>
            <span class="tag conf">${(p.confidence * 100).toFixed(0)}%</span>
            <div style="margin-top:6px; color:#444">${escapeHtml(p.narration || p.dialogue || '(no text)')}</div>
          </div>
        `;
        galleryEl.appendChild(el);
      }
    }

    function escapeHtml(s: string) {
      return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c] || c));
    }
  </script>
</body>
</html>
