<script id="cinematic-addon-js">
window._currentSession=()=>store.session;

// ================================================================
// Cinematic Studio state
// ================================================================
const CIN = {
  session: null,
  mode: 'auto',          // 'auto' | 'semi' | 'manual'
  preset: 'dynamic',
  grade: 'manhwa',
  pollTimer: null,
  selectedPanel: null,
  stageStates: {},
  panels: [],
  panelFxDraft: {},
  overlays: [],
};

const CIN_STAGES = [
  { id: 'segment_panels',    name: 'Panel Detection',  desc: 'AI segments the strip into panels', emoji: '🔍' },
  { id: 'gemini_narration',  name: 'AI Narration',     desc: 'Gemini writes narration scripts',  emoji: '✍️' },
  { id: 'tts_audio',         name: 'TTS Voice',        desc: 'Edge/Google TTS renders audio',    emoji: '🎤' },
  { id: 'render_video',      name: 'Base Render',      desc: 'FFmpeg assembles the base video',  emoji: '🖥' },
  { id: 'cinematic_render',  name: 'Cinematic Pass',   desc: 'Adds effects, grade, transitions', emoji: '🎬' },
];

const FX_TYPES = [
  { id: 'auto',       label: 'Auto',       emoji: '🤖' },
  { id: 'punch_zoom', label: 'Punch Zoom', emoji: '💥' },
  { id: 'ken_burns',  label: 'Ken Burns',  emoji: '📷' },
  { id: 'shake',      label: 'Shake',      emoji: '📳' },
  { id: 'still',      label: 'Still',      emoji: '🖼' },
];

// ── Init ─────────────────────────────────────────────────────────
function cinInit(session) {
  CIN.session = session;
  // Load config from server
  fetch(`/api/cinematic/${session}/config`)
    .then(r => r.json())
    .then(cfg => {
      cinApplyConfig(cfg);
    })
    .catch(() => {});
  // Load panels for manual strip
  fetch(`/api/panels/${session}?combined=true`)
    .then(r => r.json())
    .then(data => {
      CIN.panels = (data.panels || []).filter(p => !p.deleted);
      cinRenderPanelStrip();
    })
    .catch(() => {});
  // Load stage states for semi-auto
  cinRefreshStages();
  cinRenderStageList();
  cinRenderWaveform();
}

function cinApplyConfig(cfg) {
  if (!cfg) return;
  if (cfg.style) setCinPreset(cfg.style, false);
  if (cfg.glitch_transitions !== undefined) document.getElementById('cin-glitch').checked = cfg.glitch_transitions;
  if (cfg.letterbox !== undefined) document.getElementById('cin-letterbox').checked = cfg.letterbox;
}

// ── Mode switching ────────────────────────────────────────────────
function setCinMode(mode) {
  CIN.mode = mode;
  ['auto','semi','manual'].forEach(m => {
    document.getElementById(`cin-mode-${m}`).style.opacity = m === mode ? '1' : '.45';
  });
  document.getElementById('cin-auto-panel').style.display   = mode === 'auto'   ? '' : 'none';
  document.getElementById('cin-semi-panel').style.display   = mode === 'semi'   ? '' : 'none';
  document.getElementById('cin-manual-panel').style.display = mode === 'manual' ? '' : 'none';
  if (mode === 'semi') cinRenderStageList();
  if (mode === 'manual') cinRenderPanelStrip();
}

// ── Preset ────────────────────────────────────────────────────────
function setCinPreset(preset, save = true) {
  CIN.preset = preset;
  ['dynamic','subtle','custom'].forEach(p => {
    const el = document.getElementById(`preset-${p}`);
    if (el) el.style.background = p === preset ? 'var(--acc)' : '';
    if (el) el.style.color = p === preset ? 'var(--ink)' : '';
  });
  if (save) cinSaveGlobal();
}

// ── Grade swatches ────────────────────────────────────────────────
function cinSetGrade(preset, el) {
  CIN.grade = preset;
  document.querySelectorAll('.grade-sw').forEach(s => s.classList.toggle('on', s === el));
  cinSaveGlobal();
}

// ── Save global config ────────────────────────────────────────────
function cinSaveGlobal() {
  if (!CIN.session) return;
  const cfg = {
    enabled: true,
    style: CIN.preset,
    glitch_transitions: document.getElementById('cin-glitch').checked,
    letterbox: document.getElementById('cin-letterbox').checked,
    color_preset: CIN.grade,
    global_overrides: {
      zoom_peak:          parseFloat(document.getElementById('sl-zoom').value),
      shake_intensity:    parseFloat(document.getElementById('sl-shake').value),
      speedlines_opacity: parseFloat(document.getElementById('sl-slines').value),
      kb_zoom_range:      parseFloat(document.getElementById('sl-kb').value),
      enable_speedlines:  document.getElementById('cin-speedlines').checked,
      enable_shake:       document.getElementById('cin-shake').checked,
      enable_vignette:    document.getElementById('cin-vignette').checked,
    },
  };
  fetch(`/api/cinematic/${CIN.session}/config`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(cfg),
  }).catch(() => {});
}

// ── BGM volume save ───────────────────────────────────────────────
function cinSaveBgmVolume(v) {
  if (!CIN.session) return;
  fetch(`/api/cinematic/${CIN.session}/config`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ bgm_volume: parseFloat(v) }),
  }).catch(() => {});
}

// ── BGM upload ────────────────────────────────────────────────────
function cinUploadBgm(file) {
  if (!file || !CIN.session) return;
  const fd = new FormData();
  fd.append('file', file);
  const nameEl = document.getElementById('cin-bgm-name');
  nameEl.textContent = '⏫ Uploading...';
  nameEl.style.display = '';
  fetch(`/api/cinematic/${CIN.session}/bgm`, { method: 'POST', body: fd })
    .then(r => r.json())
    .then(() => {
      nameEl.textContent = '✓ ' + file.name;
      cinRenderWaveform();
      toast(`BGM set: ${file.name}`);
    })
    .catch(e => { nameEl.textContent = '✗ Failed'; toast('BGM upload failed', true); });
}

// ── Waveform (decorative bars) ────────────────────────────────────
function cinRenderWaveform() {
  const el = document.getElementById('cin-waveform');
  if (!el) return;
  el.innerHTML = '';
  const N = 48;
  for (let i = 0; i < N; i++) {
    const h = 8 + Math.abs(Math.sin(i * 0.7) * 24 + Math.sin(i * 1.3) * 12);
    const b = document.createElement('div');
    b.className = 'wbar';
    b.style.height = h + 'px';
    el.appendChild(b);
  }
}

// ── Semi-auto: stage list ─────────────────────────────────────────
function cinRenderStageList() {
  const el = document.getElementById('cin-stages-list');
  if (!el) return;
  el.innerHTML = '';
  CIN_STAGES.forEach((stage, i) => {
    const state = CIN.stageStates[stage.id];
    const done = state === true;
    const running = state === 'running';
    const err = state === 'error';
    const locked = !done && i > 0 && !CIN.stageStates[CIN_STAGES[i-1].id];
    const cls = done ? 'done' : running ? 'running' : err ? 'error' : locked ? 'locked' : '';
    const el2 = document.createElement('div');
    el2.className = `cin-stage ${cls}`;
    el2.id = `stage-row-${stage.id}`;
    el2.innerHTML = `
      <div class="smark">${done ? '✓' : err ? '✗' : stage.emoji}</div>
      <div>
        <div class="sname">${stage.name}</div>
        <div class="sdesc">${stage.desc}</div>
      </div>
      <div class="chip ${done?'ok':''} sm" style="font-size:10px;white-space:nowrap">
        ${done ? 'Done' : running ? 'Running…' : err ? 'Error' : 'Pending'}
      </div>
      <button class="srun" id="srun-${stage.id}"
        ${locked || running ? 'disabled' : ''}
        onclick="cinRunStage('${stage.id}')">
        ${done ? '↺ Re-run' : '▶ Run'}
      </button>`;
    el.appendChild(el2);
  });
}

async function cinRefreshStages() {
  if (!CIN.session) return;
  try {
    const r = await fetch(`/api/pipeline/${CIN.session}/stages`);
    const d = await r.json();
    if (d.stages) {
      Object.entries(d.stages).forEach(([k, v]) => { CIN.stageStates[k] = v; });
      cinRenderStageList();
    }
  } catch (e) {}
}

async function cinRunStage(stageId) {
  if (!CIN.session) { toast('Select a session first', true); return; }
  CIN.stageStates[stageId] = 'running';
  cinRenderStageList();

  const settings = await fetch('/api/settings').then(r=>r.json()).catch(()=>({}));
  const payload = {
    session: CIN.session,
    stage: stageId,
    tts: settings.tts || 'edge',
    voice: settings.voice || 'en-US-AriaNeural',
    style: settings.style || 'recap',
    backend: settings.backend || 'xkiro',
  };

  try {
    const r = await fetch('/api/pipeline/step', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload),
    });
    const d = await r.json();
    if (d.job_id) cinPollStage(stageId, d.job_id);
    else { CIN.stageStates[stageId] = 'error'; cinRenderStageList(); }
  } catch (e) {
    CIN.stageStates[stageId] = 'error';
    cinRenderStageList();
    toast(`Stage failed: ${e}`, true);
  }
}

function cinPollStage(stageId, jobId) {
  const t = setInterval(async () => {
    try {
      const r = await fetch(`/api/jobs/${jobId}`);
      const d = await r.json();
      if (d.status === 'completed') {
        CIN.stageStates[stageId] = true;
        clearInterval(t);
        cinRenderStageList();
        // Auto-show video if cinematic render done
        if (stageId === 'cinematic_render') cinShowOutputVideo();
        toast(`${stageId} complete ✓`);
      } else if (d.status === 'failed' || d.status === 'cancelled') {
        CIN.stageStates[stageId] = 'error';
        clearInterval(t);
        cinRenderStageList();
        toast(`${stageId} failed`, true);
      }
    } catch (e) { clearInterval(t); }
  }, 1800);
}

// ── Full auto run ─────────────────────────────────────────────────
async function cinRunFull() {
  if (!CIN.session) { toast('Select a session first', true); return; }
  document.getElementById('cin-full-progress').style.display = '';
  document.getElementById('cin-run-full-btn').disabled = true;
  const settings = await fetch('/api/settings').then(r=>r.json()).catch(()=>({}));
  const r = await fetch('/api/run', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      session: CIN.session,
      tts: settings.tts || 'edge',
      voice: settings.voice || 'en-US-AriaNeural',
      style: settings.style || 'recap',
      backend: settings.backend || 'xkiro',
    }),
  }).catch(() => null);
  if (!r || !r.ok) { toast('Pipeline start failed', true); return; }
  const d = await r.json();
  cinPollFull(d.job_id);
}

function cinPollFull(jobId) {
  const bar = document.getElementById('cin-pbar');
  const stage = document.getElementById('cin-pstage');
  const t = setInterval(async () => {
    const r = await fetch(`/api/jobs/${jobId}`).catch(()=>null);
    if (!r) return;
    const d = await r.json();
    bar.style.width = (d.progress||0) + '%';
    stage.textContent = d.stage || 'running...';
    if (d.status === 'completed') {
      clearInterval(t);
      stage.textContent = 'Complete — running cinematic pass…';
      cinRenderOnly();
    } else if (d.status === 'failed') {
      clearInterval(t);
      stage.textContent = 'Failed: ' + (d.error || 'unknown');
      document.getElementById('cin-run-full-btn').disabled = false;
      toast('Pipeline failed', true);
    }
  }, 1500);
}

async function cinRenderOnly() {
  if (!CIN.session) { toast('Select a session first', true); return; }
  const btn = document.getElementById('cin-render-btn');
  if (btn) btn.disabled = true;
  toast('Starting cinematic render…');
  const r = await fetch(`/api/cinematic/${CIN.session}/apply`, { method: 'POST' }).catch(()=>null);
  if (!r || !r.ok) { toast('Render start failed', true); if (btn) btn.disabled = false; return; }
  const d = await r.json();
  const t = setInterval(async () => {
    const jr = await fetch(`/api/jobs/${d.job_id}`).catch(()=>null);
    if (!jr) return;
    const jd = await jr.json();
    if (jd.status === 'completed') {
      clearInterval(t);
      if (btn) btn.disabled = false;
      cinShowOutputVideo();
      toast('Cinematic render complete ✓');
    } else if (jd.status === 'failed') {
      clearInterval(t);
      if (btn) btn.disabled = false;
      toast('Cinematic render failed: ' + (jd.error||'?'), true);
    }
  }, 2000);
}

function cinShowOutputVideo() {
  if (!CIN.session) return;
  const wrap = document.getElementById('cin-video-wrap');
  const video = document.getElementById('cin-output-video');
  const dlLink = document.getElementById('cin-dl-link');
  const url = `/api/cinematic/${CIN.session}/video`;
  video.src = url + '?t=' + Date.now();
  wrap.style.display = '';
  if (dlLink) { dlLink.href = url; dlLink.download = 'cinematic_recap.mp4'; }
}

// ── Panel strip (manual mode) ─────────────────────────────────────
function cinRenderPanelStrip() {
  const el = document.getElementById('cin-panel-strip');
  if (!el) return;
  el.innerHTML = '';
  CIN.panels.forEach(p => {
    const div = document.createElement('div');
    div.className = 'pfx-thumb';
    div.id = 'pfx-' + p.id;
    div.onclick = () => cinSelectPanel(p.id);
    div.innerHTML = `
      <img src="/api/jobs/${CIN.session}/files/${encodeURIComponent(p.image_file)}" onerror="this.style.background='var(--ink4)'" loading="lazy">
      <div class="pfx-label">#${(p.panel_index||0)}</div>
      <div class="pfx-type" id="pfx-type-${p.id}">auto</div>`;
    el.appendChild(div);
  });
}

function cinSelectPanel(panelId) {
  CIN.selectedPanel = panelId;
  document.querySelectorAll('.pfx-thumb').forEach(el => el.classList.remove('on'));
  const el = document.getElementById('pfx-' + panelId);
  if (el) el.classList.add('on');
  const detail = document.getElementById('cin-panel-detail');
  if (detail) detail.style.display = '';
  const titleEl = document.getElementById('cin-detail-title');
  const panel = CIN.panels.find(p => p.id === panelId);
  if (titleEl && panel) titleEl.textContent = `Panel ${panel.panel_index} — ${panel.panel_type || 'unknown'}`;
  // Render effect type buttons
  const btns = document.getElementById('cin-effect-type-btns');
  if (btns) {
    btns.innerHTML = '';
    FX_TYPES.forEach(fx => {
      const b = document.createElement('button');
      b.className = 'btn sm';
      b.id = 'fxbtn-' + fx.id;
      b.textContent = fx.emoji + ' ' + fx.label;
      b.onclick = () => { CIN.panelFxDraft.effect_type = fx.id; cinUpdateFxBtns(); cinRenderFxSliders(fx.id); };
      btns.appendChild(b);
    });
    cinUpdateFxBtns();
  }
  cinRenderFxSliders(CIN.panelFxDraft.effect_type || 'auto');
}

function cinUpdateFxBtns() {
  FX_TYPES.forEach(fx => {
    const b = document.getElementById('fxbtn-' + fx.id);
    if (b) {
      const on = (CIN.panelFxDraft.effect_type || 'auto') === fx.id;
      b.style.background = on ? 'var(--acc)' : '';
      b.style.color = on ? 'var(--ink)' : '';
    }
  });
}

function cinRenderFxSliders(fxType) {
  const el = document.getElementById('cin-effect-sliders');
  if (!el) return;
  let html = '';
  if (fxType === 'punch_zoom' || fxType === 'auto') {
    html += `<div class="sl-row"><label>Zoom peak</label>
      <input type="range" min="1.0" max="1.5" step="0.01" value="${CIN.panelFxDraft.zoom_peak||1.22}"
        oninput="CIN.panelFxDraft.zoom_peak=parseFloat(this.value);this.nextElementSibling.value=this.value">
      <output>${CIN.panelFxDraft.zoom_peak||1.22}</output></div>`;
  }
  if (fxType === 'shake' || fxType === 'auto') {
    html += `<div class="sl-row"><label>Shake px</label>
      <input type="range" min="1" max="20" step="0.5" value="${CIN.panelFxDraft.shake_px||7}"
        oninput="CIN.panelFxDraft.shake_px=parseFloat(this.value);this.nextElementSibling.value=this.value+'px'">
      <output>${CIN.panelFxDraft.shake_px||7}px</output></div>`;
  }
  if (fxType === 'ken_burns' || fxType === 'auto') {
    html += `<div class="sl-row"><label>KB zoom</label>
      <input type="range" min="0" max="0.2" step="0.005" value="${CIN.panelFxDraft.kb_zoom||0.09}"
        oninput="CIN.panelFxDraft.kb_zoom=parseFloat(this.value);this.nextElementSibling.value=Math.round(this.value*100)+'%'">
      <output>${Math.round((CIN.panelFxDraft.kb_zoom||0.09)*100)}%</output></div>`;
  }
  el.innerHTML = html;
}

function cinSavePanelFx() {
  if (!CIN.session || !CIN.selectedPanel) return;
  fetch(`/api/cinematic/${CIN.session}/panel-override`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ panel_id: CIN.selectedPanel, overrides: CIN.panelFxDraft }),
  }).then(() => toast('Panel effect saved ✓')).catch(() => toast('Save failed', true));
  const typeEl = document.getElementById('pfx-type-' + CIN.selectedPanel);
  if (typeEl) typeEl.textContent = CIN.panelFxDraft.effect_type || 'custom';
}

function cinClearPanelFx() {
  if (!CIN.session || !CIN.selectedPanel) return;
  CIN.panelFxDraft = {};
  cinRenderFxSliders('auto');
  cinUpdateFxBtns();
  fetch(`/api/cinematic/${CIN.session}/panel-override`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ panel_id: CIN.selectedPanel, overrides: null }),
  }).then(() => toast('Panel override cleared')).catch(() => {});
  const typeEl = document.getElementById('pfx-type-' + CIN.selectedPanel);
  if (typeEl) typeEl.textContent = 'auto';
}

async function cinPreviewPanel() {
  if (!CIN.session || !CIN.selectedPanel) return;
  await cinSavePanelFx();
  const btn = document.getElementById('cin-preview-btn');
  const vid = document.getElementById('cin-panel-preview');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Generating…'; }
  vid.style.display = 'none';
  // server-side preview generation (blocking for short clips)
  const url = `/api/cinematic/${CIN.session}/preview/${CIN.selectedPanel}?t=${Date.now()}`;
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(await r.text());
    const blob = await r.blob();
    vid.src = URL.createObjectURL(blob);
    vid.style.display = '';
    vid.play();
  } catch (e) {
    toast('Preview failed: ' + e, true);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '▶ Preview clip'; }
  }
}

// ── Text overlay helpers ──────────────────────────────────────────
function cinAddOverlay() {
  CIN.overlays.push({ id: Date.now(), text: '', start: 0, end: 3 });
  cinRenderOverlays();
}

function cinRenderOverlays() {
  const el = document.getElementById('cin-overlay-list');
  if (!el) return;
  el.innerHTML = '';
  CIN.overlays.forEach((ov, i) => {
    const div = document.createElement('div');
    div.className = 'ov-item';
    div.innerHTML = `<input value="${ov.text||''}" placeholder="Overlay text…" oninput="CIN.overlays[${i}].text=this.value">
      <button class="ov-del" onclick="CIN.overlays.splice(${i},1);cinRenderOverlays()">✕</button>`;
    el.appendChild(div);
  });
}

// ── Expose init to nav system ─────────────────────────────────────
// Call from the existing nav() function when view === 'cinematic':
// if (view === 'cinematic') cinInit(currentSession);
window.cinInit   = cinInit;
window.setCinMode= setCinMode;

// ── BGM drag-and-drop ─────────────────────────────────────────────
(function() {
  function ready() {
    const zone = document.getElementById('cin-bgm-zone');
    if (!zone) return;
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('over'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('over');
      const f = e.dataTransfer.files[0];
      if (f) cinUploadBgm(f);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ready);
  else ready();
})();

</script>
