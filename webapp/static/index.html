<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>recap-comic — studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   INK & GUTTER — design tokens
   ============================================================ */
:root{
  --ink:#12151B; --ink2:#171B23; --ink3:#1E2430; --ink4:#242B38;
  --line:#2A3140; --line2:#39424F;
  --txt:#E9E7DF; --txt2:#A6ABB8; --txt3:#6E7484;
  --paper:#F4F2EA; --paper2:#E9E5D8; --paper-ink:#1D1C17;
  --acc:#17C964; --acc-hi:#5FE39A; --acc-deep:#0B3D24;
  --amber:#FFB224; --coral:#FF5D5D; --sky:#58A6FF;
  --disp:"Bricolage Grotesque",sans-serif;
  --body:"Instrument Sans",sans-serif;
  --mono:"JetBrains Mono",monospace;
  --r:8px; --gut:20px;                       /* the gutter is the grid */
  --shadow:5px 5px 0 #0A0C10;
  --shadow-lg:8px 8px 0 #0A0C10;
}
*{box-sizing:border-box;margin:0}
html{color-scheme:dark}
body{
  font-family:var(--body); background:var(--ink); color:var(--txt);
  font-size:14px; line-height:1.5; min-height:100vh;
}
/* ambient halftone + glow layers */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:radial-gradient(rgba(233,231,223,.045) 1px, transparent 1.5px);
  background-size:22px 22px;
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(23,201,100,.07), transparent 60%),
    radial-gradient(700px 500px at -10% 110%, rgba(88,166,255,.05), transparent 60%);
}
::selection{background:var(--acc); color:var(--acc-deep)}
a{color:var(--sky)}
button{font-family:inherit}
:focus-visible{outline:none; box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--acc-hi); border-radius:4px}
/* ============================================================
   Shell: film-strip rail + topbar + view
   ============================================================ */
.shell{position:relative; z-index:1; display:grid; grid-template-columns:212px 1fr; min-height:100vh}
.rail{
  background:var(--ink2); border-right:1px solid var(--line);
  padding:18px 12px; display:flex; flex-direction:column; gap:2px; position:sticky; top:0; height:100vh;
}
.rail::before{ /* film perforations */
  content:""; position:absolute; left:6px; top:12px; bottom:12px; width:8px;
  background:repeating-linear-gradient(var(--ink4) 0 10px, transparent 10px 20px);
  border-radius:3px; opacity:.7;
}
.brand{font-family:var(--disp); font-weight:800; font-size:20px; letter-spacing:.02em;
  padding:2px 8px 16px 22px; line-height:1.05}
.brand em{font-style:normal; color:var(--acc)}
.brand small{display:block; font-family:var(--mono); font-weight:400; font-size:9.5px;
  letter-spacing:.22em; color:var(--txt3); text-transform:uppercase; margin-top:4px}
.rail a{
  display:flex; align-items:center; gap:10px; padding:9px 10px 9px 22px; border-radius:var(--r);
  color:var(--txt2); text-decoration:none; font-weight:500; font-size:13.5px;
  border:1px solid transparent; transition:background .15s, color .15s, transform .15s;
}
.rail a svg{width:16px;height:16px; flex:none}
.rail a:hover{background:var(--ink3); color:var(--txt); transform:translateX(2px)}
.rail a.on{background:var(--ink4); color:var(--txt); border-color:var(--line2);
  box-shadow:inset 3px 0 0 var(--acc)}
.rail .sep{height:1px; background:var(--line); margin:10px 8px}
.rail .foot{margin-top:auto; padding:12px 22px 0; font-family:var(--mono); font-size:10px; color:var(--txt3)}
.main{display:flex; flex-direction:column; min-width:0}
.topbar{
  position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:12px;
  padding:12px 26px; background:rgba(18,21,27,.86); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.proj{
  font-family:var(--mono); font-size:12px; color:var(--txt); background:var(--ink3);
  border:1px solid var(--line2); border-radius:var(--r); padding:7px 12px; cursor:pointer;
  max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.pill{display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:11px;
  letter-spacing:.06em; text-transform:uppercase; padding:5px 11px; border-radius:999px;
  border:1px solid var(--line2); color:var(--txt2); background:var(--ink3)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--txt3)}
.pill[data-status="running"]{color:var(--amber); border-color:rgba(255,178,36,.4)}
.pill[data-status="running"] .dot{background:var(--amber); animation:pulse 1.1s ease-in-out infinite}
.pill[data-status="completed"]{color:var(--acc); border-color:rgba(23,201,100,.4)}
.pill[data-status="completed"] .dot{background:var(--acc)}
.pill[data-status="failed"]{color:var(--coral); border-color:rgba(255,93,93,.45)}
.pill[data-status="failed"] .dot{background:var(--coral)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.5}}
.topbar .spacer{flex:1}
.gbadge{font-family:var(--mono); font-size:11px; color:var(--txt2); border:1px dashed var(--line2);
  border-radius:var(--r); padding:6px 10px; cursor:default}
.gbadge.ok{color:var(--acc); border-color:rgba(23,201,100,.4); border-style:solid}
/* ============================================================
   Components
   ============================================================ */
.lbl{font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--txt3)}
.h-disp{font-family:var(--disp); font-weight:800; letter-spacing:-.01em}
.cutline{border:none; border-top:2px dashed var(--line2); margin:26px 0}
.panel{background:var(--ink2); border:1px solid var(--line); border-radius:var(--r); padding:18px}
.panel.lift{box-shadow:var(--shadow); transition:transform .16s ease, box-shadow .16s ease, border-color .16s}
.panel.lift:hover{transform:translate(-2px,-2px); box-shadow:var(--shadow-lg); border-color:var(--line2)}
.btn{
  display:inline-flex; align-items:center; gap:8px; cursor:pointer;
  font-weight:600; font-size:13px; color:var(--txt);
  background:var(--ink4); border:1px solid var(--line2); border-radius:var(--r);
  padding:9px 15px; box-shadow:3px 3px 0 #0A0C10;
  transition:transform .12s, box-shadow .12s, background .15s, opacity .15s;
}
.btn:hover{background:var(--ink3); transform:translate(-1px,-1px); box-shadow:4px 4px 0 #0A0C10}
.btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 #0A0C10}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none; box-shadow:3px 3px 0 #0A0C10}
.btn.acc{background:var(--acc); border-color:var(--acc); color:var(--acc-deep)}
.btn.acc:hover{background:var(--acc-hi)}
.btn.danger{background:transparent; border-color:rgba(255,93,93,.5); color:var(--coral)}
.btn.danger:hover{background:rgba(255,93,93,.1)}
.btn.ghost{background:transparent; box-shadow:none; border-color:transparent; color:var(--txt2)}
.btn.ghost:hover{color:var(--txt); background:var(--ink3); box-shadow:none; transform:none}
.btn.sm{padding:5px 10px; font-size:12px; box-shadow:2px 2px 0 #0A0C10}
.chip{display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:10.5px;
  letter-spacing:.05em; padding:3px 8px; border-radius:5px; border:1px solid var(--line2);
  color:var(--txt2); background:var(--ink3); white-space:nowrap}
.chip.warn{color:var(--amber); border-color:rgba(255,178,36,.45)}
.chip.bad{color:var(--coral); border-color:rgba(255,93,93,.45)}
.chip.ok{color:var(--acc); border-color:rgba(23,201,100,.4)}
.chip.info{color:var(--sky); border-color:rgba(88,166,255,.4)}
.field{display:flex; flex-direction:column; gap:6px}
.field input,.field select,.field textarea{
  font-family:var(--body); font-size:13.5px; color:var(--txt);
  background:var(--ink3); border:1px solid var(--line2); border-radius:var(--r);
  padding:9px 11px; transition:border-color .15s, box-shadow .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none; border-color:var(--acc); box-shadow:0 0 0 3px rgba(23,201,100,.15)}
.field textarea{resize:vertical; min-height:64px; line-height:1.45}
.toastwrap{position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:10px; z-index:60}
.toast{
  background:var(--ink4); border:1px solid var(--line2); border-left:4px solid var(--acc);
  border-radius:var(--r); box-shadow:var(--shadow); padding:11px 15px; font-size:13px; max-width:340px;
  animation:tin .3s cubic-bezier(.2,.7,.3,1) both;
}
.toast.err{border-left-color:var(--coral)}
.toast.warn{border-left-color:var(--amber)}
.toast.out{animation:tout .25s ease both}
@keyframes tin{from{opacity:0; transform:translateX(24px)} to{opacity:1; transform:none}}
@keyframes tout{to{opacity:0; transform:translateY(8px)}}
.reveal{opacity:0; transform:translateY(14px)}
.reveal.in{opacity:1; transform:none; transition:opacity .5s ease, transform .5s cubic-bezier(.2,.7,.3,1); transition-delay:var(--d,0ms)}
/* ============================================================
   Studio (home): the strip comes first
   ============================================================ */
.studio{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr); gap:var(--gut); align-items:start}
.studio h1{font-size:clamp(34px,4.4vw,56px); line-height:1.02; margin:10px 0 8px}
.studio h1 .go{color:var(--acc)}
.studio .lede{color:var(--txt2); max-width:46ch; margin-bottom:22px}
.dropzone{
  border:2px dashed var(--line2); border-radius:10px; background:var(--ink2);
  padding:34px 26px; display:grid; grid-template-columns:96px 1fr; gap:22px; align-items:center;
  cursor:pointer; transition:border-color .18s, background .18s, transform .18s;
}
.dropzone:hover,.dropzone.over{border-color:var(--acc); background:rgba(23,201,100,.05); transform:translateY(-2px)}
.dropzone .stripmark{ /* a tiny vertical strip: the app's signature */
  width:96px; height:150px; border:2px solid var(--line2); border-radius:6px; overflow:hidden;
  background:linear-gradient(var(--ink4) 0 30%, var(--acc-deep) 30% 34%, var(--ink3) 34% 62%, var(--acc-deep) 62% 66%, var(--ink4) 66% 100%);
  position:relative;
}
.dropzone .stripmark::after{content:""; position:absolute; inset:0;
  background:repeating-linear-gradient(0deg, rgba(233,231,223,.06) 0 2px, transparent 2px 7px)}
.dropzone h3{font-family:var(--disp); font-weight:700; font-size:21px; margin-bottom:4px}
.dropzone p{color:var(--txt3); font-size:13px}
.dropzone .fmts{margin-top:10px; display:flex; gap:6px; flex-wrap:wrap}
/* automation/manual mode toggle on the studio dropzone */
.modeToggle{display:inline-flex; gap:0; margin-top:14px; border:1px solid var(--line2); border-radius:var(--r); overflow:hidden; background:var(--ink3)}
.mtBtn{padding:8px 16px; font-size:13px; font-weight:600; font-family:var(--body); color:var(--txt3); background:transparent; border:0; cursor:pointer; transition:background .15s,color .15s}
.mtBtn:hover{color:var(--txt)}
.mtBtn.on{background:var(--acc); color:var(--ink)}
.mtBtn.on[data-mode="manual"]{background:var(--amber)}
.sysgrid{display:grid; gap:var(--gut)}
.recent{display:flex; flex-direction:column; gap:12px}
.rcard{display:grid; grid-template-columns:1fr auto; gap:6px 14px; align-items:center; cursor:pointer}
.rcard .name{font-family:var(--disp); font-weight:700; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rcard .sub{font-family:var(--mono); font-size:11px; color:var(--txt3)}
.rcard .acts{display:flex; gap:6px; grid-column:1/-1; margin-top:4px}
.statrow{display:flex; gap:26px; flex-wrap:wrap}
.stat .num{font-family:var(--disp); font-weight:800; font-size:34px; line-height:1}
.stat .num.grn{color:var(--acc)}
/* ============================================================
   Panels grid — tall frames, never cropped
   ============================================================ */
.pgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:var(--gut)}
.pcard{cursor:grab; user-select:none; padding:0; overflow:hidden; position:relative}
.pcard.dragging{opacity:.35}
.pcard.drag-over{border-color:var(--acc); box-shadow:0 0 0 3px rgba(23,201,100,.25), var(--shadow)}
.pcard .frame{aspect-ratio:9/16; background:#0D0F13; display:flex; align-items:center; justify-content:center; overflow:hidden; border-bottom:1px solid var(--line)}
.pcard .frame img{max-width:100%; max-height:100%; object-fit:contain; transition:transform .25s ease}
.pcard:hover .frame img{transform:scale(1.03)}
.pcard .ord{position:absolute; top:8px; left:8px; font-family:var(--disp); font-weight:800; font-size:15px;
  background:var(--ink); color:var(--acc); border:1px solid var(--line2); border-radius:6px; padding:2px 8px}
.pcard .meta{padding:10px 12px 12px; display:flex; flex-direction:column; gap:7px}
.pcard .chips{display:flex; gap:5px; flex-wrap:wrap}
.pcard .nar{font-size:12px; color:var(--txt2); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.4em}
.pcard .flags{font-family:var(--mono); font-size:10.5px; color:var(--txt3); display:flex; gap:10px}
.pcard .flags b.ok{color:var(--acc); font-weight:600}
/* lightbox */
dialog#lightbox{
  border:1px solid var(--line2); border-radius:12px; background:var(--paper); color:var(--paper-ink);
  padding:0; width:min(960px,94vw); box-shadow:12px 12px 0 rgba(0,0,0,.5);
}
dialog#lightbox::backdrop{background:rgba(10,12,16,.75)}
.lb{display:grid; grid-template-columns:minmax(0,1fr) 300px; min-height:420px}
.lb .imgside{background:#0D0F13; display:flex; align-items:center; justify-content:center; padding:18px; border-radius:12px 0 0 12px}
.lb .imgside img{max-height:74vh; max-width:100%; object-fit:contain}
.lb .info{padding:20px; display:flex; flex-direction:column; gap:14px; overflow:auto; max-height:78vh}
.lb h3{font-family:var(--disp); font-weight:800; font-size:24px}
.lb .kv{font-family:var(--mono); font-size:11.5px; color:#5c584c; display:grid; gap:5px}
.lb .txt{background:var(--paper2); border-radius:8px; padding:11px 12px; font-size:13px; line-height:1.5}
.lb .x{position:absolute}
dialog .closebtn{position:absolute; top:10px; right:12px}
/* ============================================================
   Generate — the stage machine
   ============================================================ */
.gen{display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:var(--gut); align-items:start}
.stepper{list-style:none; display:flex; flex-direction:column; gap:2px; padding:8px 0}
.step{display:grid; grid-template-columns:30px 1fr auto; align-items:center; gap:12px;
  padding:10px 12px; border-radius:var(--r); border:1px solid transparent}
.step .mark{width:24px;height:24px;border-radius:50%; display:flex;align-items:center;justify-content:center;
  font-family:var(--mono); font-size:11px; border:1.5px solid var(--line2); color:var(--txt3); background:var(--ink3)}
.step .name{font-weight:500; color:var(--txt3)}
.step.done .mark{background:var(--acc); border-color:var(--acc); color:var(--acc-deep)}
.step.done .name{color:var(--txt2)}
.step.running{background:rgba(255,178,36,.06); border-color:rgba(255,178,36,.28)}
.step.running .mark{background:var(--amber); border-color:var(--amber); color:#3d2b00; animation:pulse 1.2s infinite}
.step.running .name{color:var(--txt); font-weight:600}
.step.failed{background:rgba(255,93,93,.07); border-color:rgba(255,93,93,.32)}
.step.failed .mark{background:var(--coral); border-color:var(--coral); color:#3d0505}
.step.failed .name{color:var(--coral); font-weight:600}
.progress{height:10px; border-radius:99px; background:var(--ink3); border:1px solid var(--line); overflow:hidden; margin:6px 0 2px}
.progress i{display:block; height:100%; width:0%; border-radius:99px; background:var(--amber);
  background-image:repeating-linear-gradient(45deg, rgba(0,0,0,.18) 0 8px, transparent 8px 16px);
  background-size:24px 24px; animation:stripes .8s linear infinite; transition:width .5s ease}
@keyframes stripes{to{background-position:24px 0}}
.errbox{border:1px solid rgba(255,93,93,.4); background:rgba(255,93,93,.08); color:#ffb4b4;
  border-radius:var(--r); padding:13px 15px; font-family:var(--mono); font-size:12px; margin-top:14px; white-space:pre-wrap}
/* ============================================================
   Review — video + synced cues
   ============================================================ */
.rev{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:var(--gut); align-items:start}
.vwrap{background:#0B0D10; border:1px solid var(--line); border-radius:10px; overflow:hidden}
.vwrap video{display:block; width:100%; max-height:72vh; background:#000}
.vmeta{display:flex; align-items:center; gap:12px; padding:10px 14px; border-top:1px solid var(--line); font-family:var(--mono); font-size:11.5px; color:var(--txt3)}
.cues{display:flex; flex-direction:column; gap:8px; max-height:66vh; overflow:auto; padding-right:4px}
.cue{background:var(--paper); color:var(--paper-ink); border-radius:7px; padding:10px 12px; cursor:pointer;
  font-size:13px; line-height:1.45; border-left:4px solid transparent; transition:transform .14s, border-color .14s}
.cue:hover{transform:translateX(3px)}
.cue.on{border-left-color:var(--acc); box-shadow:3px 3px 0 rgba(0,0,0,.4)}
.cue time{display:block; font-family:var(--mono); font-size:10px; color:#8a8474; margin-bottom:3px}
/* ============================================================
   Editor — preview / properties / timeline, one language
   ============================================================ */
.ed{display:grid; grid-template-columns:minmax(0,1fr) 300px; grid-template-rows:auto auto; gap:var(--gut)}
.ed .preview{grid-row:1; background:#0B0D10; border:1px solid var(--line); border-radius:10px; overflow:hidden}
.ed .preview video{width:100%; max-height:52vh; display:block; background:#000}
.transport{display:flex; align-items:center; gap:12px; padding:10px 14px; border-top:1px solid var(--line)}
.transport input[type=range]{flex:1; accent-color:var(--acc)}
.transport .tc{font-family:var(--mono); font-size:12px; color:var(--txt2); min-width:110px; text-align:right}
.props{grid-row:1 / span 2; display:flex; flex-direction:column; gap:14px; align-self:start; position:sticky; top:78px}
.props .grp{display:flex; flex-direction:column; gap:8px}
.props .auto{font-family:var(--mono); font-size:10.5px; color:var(--txt3)}
.props .auto b{color:var(--sky); font-weight:600}
.tlwrap{grid-column:1; background:var(--ink2); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.tlhead{display:flex; align-items:center; justify-content:space-between; padding:9px 14px; border-bottom:1px solid var(--line)}
.tlscroll{overflow-x:auto; padding:14px}
.tlrow{position:relative; height:64px; min-width:100%}
.tlrow.cap{height:34px; margin-top:8px}
.clip{position:absolute; top:0; bottom:0; background:var(--ink4); border:1px solid var(--line2); border-radius:7px;
  overflow:hidden; cursor:pointer; display:flex; flex-direction:column; transition:border-color .13s, box-shadow .13s}
.clip:hover{border-color:var(--txt3)}
.clip.sel{border-color:var(--acc); box-shadow:0 0 0 2px rgba(23,201,100,.28)}
.clip img{height:34px; width:100%; object-fit:cover; pointer-events:none; opacity:.85}
.clip .cm{font-family:var(--mono); font-size:9.5px; color:var(--txt2); padding:2px 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.clip .hd{position:absolute; top:0; bottom:0; width:7px; cursor:ew-resize; background:rgba(233,231,223,.08)}
.clip .hd.l{left:0}.clip .hd.r{right:0}
.clip .hd:hover{background:rgba(23,201,100,.35)}
.capchip{position:absolute; top:0; bottom:0; background:var(--paper); color:var(--paper-ink); border-radius:6px;
  font-size:11px; padding:6px 9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer;
  border-left:3px solid var(--sky)}
.capchip.sel{box-shadow:0 0 0 2px rgba(88,166,255,.4)}
.trmark{position:absolute; top:-9px; transform:translateX(-50%); width:14px; height:14px; background:var(--ink3);
  border:1.5px solid var(--amber); rotate:45deg; border-radius:3px; cursor:pointer; z-index:2}
.trmark:hover{background:var(--amber)}
.trpop{position:absolute; z-index:5; background:var(--ink4); border:1px solid var(--line2); border-radius:8px;
  box-shadow:var(--shadow); padding:10px; display:flex; gap:8px; align-items:center}
/* ============================================================
   Logs
   ============================================================ */
.logbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px}
.logbar .chip{cursor:pointer}
.logbar .chip.on{background:var(--acc); color:var(--acc-deep); border-color:var(--acc)}
.logbar input{flex:1; min-width:160px}
.loglist{list-style:none; font-family:var(--mono); font-size:12px; background:#0D0F13; border:1px solid var(--line);
  border-radius:10px; padding:12px; max-height:62vh; overflow:auto; display:flex; flex-direction:column; gap:3px}
.loglist li{display:grid; grid-template-columns:78px 62px 130px 1fr; gap:10px; padding:3px 6px; border-radius:5px; animation:lin .25s ease both}
.loglist li:hover{background:var(--ink3)}
.loglist time{color:var(--txt3)}
.loglist .lv{font-weight:600}
.loglist .info .lv{color:var(--sky)} .loglist .warning .lv{color:var(--amber)} .loglist .error .lv{color:var(--coral)}
.loglist .st{color:var(--txt3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.loglist .msg{color:var(--txt2); word-break:break-word}
@keyframes lin{from{opacity:0; transform:translateY(5px)} to{opacity:1; transform:none}}
/* Narrator Studio grid */
.vs-grid{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:var(--gut); align-items:start}
@media (max-width:1120px){ .vs-grid{grid-template-columns:1fr} }
/* Manual Crop — boundary editor */
.manual-wrap{display:flex;gap:var(--gut);height:calc(100vh - 120px)}
.manual-stage{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.manual-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.manual-canvas{flex:1;overflow:auto;background:var(--ink3);border:1px solid var(--line);border-radius:var(--r);position:relative;cursor:crosshair}
.manual-canvas img{display:block;width:100%;height:auto;pointer-events:none;user-select:none}
.boundary{position:absolute;left:0;right:0;height:2px;background:var(--coral);pointer-events:auto;cursor:row-resize;z-index:2}
.boundary:hover{background:var(--amber)}
.boundary.selected{background:var(--amber);height:3px}
.boundary-handle{position:absolute;left:0;right:0;height:28px;top:-13px;cursor:row-resize;z-index:3;display:flex;align-items:center;justify-content:center}
.boundary-handle::after{content:"";width:36px;height:5px;border-radius:3px;background:var(--coral);opacity:.9}
.boundary-handle:hover::after{background:var(--amber);opacity:1}
.boundary.selected .boundary-handle::after{background:var(--amber)}
.boundary-grip{position:absolute;left:4px;top:-9px;width:22px;height:18px;border-radius:4px;background:rgba(255,110,110,.85);display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;cursor:row-resize;z-index:4;user-select:none;letter-spacing:1px}
.boundary-grip:hover{background:var(--amber)}
.boundary.selected .boundary-grip{background:var(--amber)}
.mc-ytip{position:absolute;left:70px;padding:2px 8px;background:var(--ink4);border:1px solid var(--line2);border-radius:4px;font-family:var(--mono);font-size:12px;color:var(--txt);z-index:6;pointer-events:none;white-space:nowrap}
.manual-side{width:260px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.preview-thumb{width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--ink2)}
.preview-thumb canvas{display:block;width:100%;height:auto}
/* source strip map in panel inspector */
.stripmap{position:relative;width:100%;border:1.5px solid var(--line2);border-radius:6px;
  background:linear-gradient(var(--ink4),var(--ink3));overflow:hidden;margin-top:8px}
.stripmap .region{position:absolute;left:0;right:0;background:rgba(23,201,100,.28);
  border-top:2px solid var(--acc);border-bottom:2px solid var(--acc)}
/* responsive: studio-grade on desktop, usable below */
@media (max-width:1120px){ .studio,.gen,.rev,.ed{grid-template-columns:1fr} .props{position:static; grid-row:auto} }
@media (max-width:760px){ .shell{grid-template-columns:1fr} .rail{position:static; height:auto; flex-direction:row; flex-wrap:wrap; align-items:center} .rail::before{display:none} .rail .foot{display:none} .dropzone{grid-template-columns:1fr} .lb{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important; transition:none!important}
  .reveal{opacity:1; transform:none}
}

/* ==== Cinematic Studio view ==================================== */
.cin-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--gut);align-items:start}
.cin-stages{display:flex;flex-direction:column;gap:6px;margin-bottom:24px}
.cin-stage{
  display:grid;grid-template-columns:28px 1fr auto auto;align-items:center;gap:12px;
  padding:11px 14px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--ink2);transition:border-color .2s,background .2s;
}
.cin-stage.done{border-color:rgba(23,201,100,.3);background:rgba(23,201,100,.05)}
.cin-stage.running{border-color:rgba(255,178,36,.4);background:rgba(255,178,36,.06);
  animation:stagepulse 1.6s ease infinite}
.cin-stage.error{border-color:rgba(255,93,93,.4);background:rgba(255,93,93,.06)}
.cin-stage.locked{opacity:.45}
@keyframes stagepulse{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 3px rgba(255,178,36,.18)}}
.cin-stage .smark{
  width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;border:1.5px solid var(--line2);color:var(--txt3);background:var(--ink3);
  transition:all .2s;
}
.cin-stage.done .smark{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.cin-stage.running .smark{background:var(--amber);border-color:var(--amber);color:var(--ink);animation:pulse 1s infinite}
.cin-stage.error .smark{background:var(--coral);border-color:var(--coral);color:var(--ink)}
.cin-stage .sname{font-weight:600;font-size:13.5px;color:var(--txt)}
.cin-stage .sdesc{font-family:var(--mono);font-size:10.5px;color:var(--txt3);margin-top:1px}
.cin-stage .srun{
  font-size:12px;font-weight:600;padding:5px 12px;border-radius:var(--r);
  background:var(--acc);color:var(--ink);border:none;cursor:pointer;
  transition:opacity .15s,transform .12s;white-space:nowrap;
}
.cin-stage .srun:hover{opacity:.85;transform:translateY(-1px)}
.cin-stage .srun:disabled{opacity:.35;cursor:not-allowed;transform:none}
.cin-stage.done .srun{background:var(--ink4);color:var(--txt2);border:1px solid var(--line2)}
/* Effect cards grid */
.fx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.fx-card{
  border:2px solid var(--line2);border-radius:var(--r);padding:10px;cursor:pointer;
  background:var(--ink3);transition:border-color .15s,transform .15s;
  display:flex;flex-direction:column;gap:5px;
}
.fx-card.on{border-color:var(--acc);background:rgba(23,201,100,.07)}
.fx-card:hover{transform:translateY(-2px);border-color:var(--txt3)}
.fx-card .fx-icon{font-size:22px;line-height:1}
.fx-card .fx-name{font-family:var(--disp);font-weight:700;font-size:13px}
.fx-card .fx-tag{font-family:var(--mono);font-size:10px;color:var(--txt3)}
/* Slider rows */
.sl-row{display:grid;grid-template-columns:1fr 48px;align-items:center;gap:10px;margin:6px 0}
.sl-row label{font-family:var(--mono);font-size:11px;color:var(--txt2)}
.sl-row input[type=range]{accent-color:var(--acc);width:100%}
.sl-row output{font-family:var(--mono);font-size:11.5px;color:var(--acc);text-align:right}
/* Color grade swatches */
.grade-swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.grade-sw{
  width:54px;height:40px;border-radius:6px;cursor:pointer;border:2px solid transparent;
  display:flex;align-items:flex-end;padding:3px;font-family:var(--mono);font-size:9px;
  color:rgba(255,255,255,.8);font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.7);
  transition:transform .15s,border-color .15s;
}
.grade-sw:hover{transform:scale(1.07)}
.grade-sw.on{border-color:var(--acc)}
.grade-sw.manhwa{background:linear-gradient(135deg,#1a2a3a,#3d5a6e,#e8b84b)}
.grade-sw.dark{background:linear-gradient(135deg,#0a0a1a,#1a1a3a,#2a2a5a)}
.grade-sw.warm{background:linear-gradient(135deg,#3a1a0a,#8b4513,#e8a030)}
.grade-sw.cold{background:linear-gradient(135deg,#0a1a3a,#1a3a6a,#5a9ad4)}
.grade-sw.vivid{background:linear-gradient(135deg,#2a0a4a,#c028c0,#f0e040)}
.grade-sw.bw{background:linear-gradient(135deg,#111,#555,#eee)}
/* BGM dropzone */
.bgm-zone{
  border:2px dashed var(--line2);border-radius:var(--r);padding:18px;
  text-align:center;cursor:pointer;transition:border-color .15s,background .15s;
  background:var(--ink3);
}
.bgm-zone:hover,.bgm-zone.over{border-color:var(--acc);background:rgba(23,201,100,.05)}
.bgm-zone .bgm-icon{font-size:28px;margin-bottom:6px}
.bgm-zone .bgm-name{font-family:var(--mono);font-size:12px;color:var(--acc);margin-top:6px}
/* Panel FX strip */
.pstrip{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scroll-snap-type:x mandatory}
.pfx-thumb{
  flex:none;width:90px;border-radius:var(--r);border:2px solid var(--line2);
  background:var(--ink3);cursor:pointer;transition:border-color .15s;scroll-snap-align:start;
}
.pfx-thumb.on{border-color:var(--acc)}
.pfx-thumb img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:4px 4px 0 0;display:block}
.pfx-thumb .pfx-label{font-family:var(--mono);font-size:9px;color:var(--txt3);padding:3px 5px;text-align:center}
.pfx-thumb .pfx-type{font-family:var(--disp);font-weight:700;font-size:10px;color:var(--txt);padding:0 5px 4px;text-align:center}
/* Enhanced timeline */
.tl-zoom{display:flex;align-items:center;gap:8px}
.tl-zoom input[type=range]{width:80px;accent-color:var(--acc)}
.tl-zoom span{font-family:var(--mono);font-size:10px;color:var(--txt3)}
.clip.selected{border-color:var(--acc)!important;box-shadow:0 0 0 2px rgba(23,201,100,.3)}
.clip-resize{
  position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;
  background:rgba(23,201,100,.5);border-radius:3px;
}
.clip-resize.left{left:0}
.clip-resize.right{right:0}
/* Export panel */
.export-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* Semi/auto mode badge on topbar */
.mode-badge{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 10px;border-radius:999px;border:1px solid;cursor:pointer;
  transition:all .15s;
}
.mode-badge.auto{color:var(--acc);border-color:rgba(23,201,100,.4);background:rgba(23,201,100,.08)}
.mode-badge.semi{color:var(--amber);border-color:rgba(255,178,36,.4);background:rgba(255,178,36,.08)}
.mode-badge.manual{color:var(--sky);border-color:rgba(88,166,255,.4);background:rgba(88,166,255,.08)}
/* Waveform bars */
.waveform{height:36px;display:flex;align-items:center;gap:1.5px;overflow:hidden;border-radius:4px;padding:0 6px;background:var(--ink3)}
.wbar{flex:1;border-radius:2px;background:var(--acc);opacity:.45;min-height:3px;transition:opacity .15s}
.wbar.active{opacity:1}
/* Text overlay editor */
.ov-list{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto}
.ov-item{
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;
  background:var(--ink3);border:1px solid var(--line2);border-radius:6px;padding:8px 10px;
}
.ov-item input{background:transparent;border:none;color:var(--txt);font-size:13px;font-family:var(--body);width:100%}
.ov-item input:focus{outline:none}
.ov-del{background:none;border:none;color:var(--coral);font-size:16px;cursor:pointer;padding:0 4px}
/* Preview player overlay */
.preview-wrap{position:relative}
.preview-badge{
  position:absolute;top:10px;left:10px;font-family:var(--mono);font-size:10px;
  background:rgba(10,12,16,.7);color:var(--acc);border:1px solid rgba(23,201,100,.4);
  padding:3px 8px;border-radius:4px;pointer-events:none;
}

</style>
</head>
<body>

<script>
/* ================================================================
   recap-comic studio — app core
   Talks ONLY to the existing FastAPI routes in webapp/main.py.
   ================================================================ */
"use strict";
const $  = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = s=>{s=Math.max(0,s||0);return `${Math.floor(s/60)}:${(s%60).toFixed(1).padStart(4,"0")}`};
const ago = t=>{if(!t)return"";const d=(Date.now()/1000-t)|0;return d<60?`${d}s ago`:d<3600?`${d/60|0}m ago`:d<86400?`${d/3600|0}h ago`:`${d/86400|0}d ago`};
const fileURL=(session,name)=>`/api/jobs/${session}/files/${encodeURIComponent(name)}`;
/* ---------------- API client (existing routes only) ---------------- */
async function req(path,opt={}){
  const r=await fetch(path,opt);
  if(!r.ok){let m=r.statusText;try{m=(await r.json()).detail||m}catch(_){}throw new Error(m)}
  const ct=r.headers.get("content-type")||"";
  return ct.includes("json")?r.json():r;
}
const jbody=b=>({method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
const api={
  config:      ()=>req("/api/config"),
  projects:    ()=>req("/api/projects"),
  upload:      (f,run=true)=>{const fd=new FormData();fd.append("file",f);return req(`/api/upload?run=${run?1:0}`,{method:"POST",body:fd})},
  run:         b=>req("/api/run",jbody(b)),
  job:         id=>req(`/api/jobs/${id}`),
  jobLogs:     id=>req(`/api/jobs/${id}?logs=1`),
  cancel:      id=>req(`/api/jobs/${id}/cancel`,{method:"POST"}),
  edGet:       s=>req(`/api/editor/${s}`),
  edCreate:    s=>req(`/api/editor/${s}/create`,{method:"POST"}),
  edPost:      (s,what,body={})=>req(`/api/editor/${s}/${what}`,jbody(body)),
  panelsGet:   s=>req(`/api/panels/${s}?combined=1`),
  panelsOrder: (s,ids)=>req(`/api/panels/${s}/order`,jbody({ids})),
  panelsDelete:(s,ids)=>req(`/api/panels/${s}/delete`,jbody({ids})),
  panelsRestore:(s,ids)=>req(`/api/panels/${s}/restore`,jbody({ids})),
  panelsReview:(s,pid,st)=>req(`/api/panels/${s}/review`,jbody({panel_id:pid,status:st})),
  panelsConfirm:(s,reviewAll=true)=>req(`/api/panels/${s}/confirm`,jbody({review_all:reviewAll})),
  panelsDuplicate:(s,pid)=>req(`/api/panels/${s}/duplicate`,jbody({panel_id:pid})),
  panelsMerge:   (s,ids)=>req(`/api/panels/${s}/merge`,jbody({ids})),
  panelsSplit:   (s,pid,frac)=>req(`/api/panels/${s}/split`,jbody({panel_id:pid,fraction:frac})),
  manualState:   s=>req(`/api/manual-crop/${s}/state`),
  manualSave:    (s,b)=>req(`/api/manual-crop/${s}/boundaries`,jbody({boundaries:b})),
  manualGenerate:s=>req(`/api/manual-crop/${s}/generate`,{method:"POST"}),
  manualReset:   s=>req(`/api/manual-crop/${s}/reset`,{method:"POST"}),
  manualGuides:  s=>req(`/api/manual-crop/${s}/guides`),
  manualStrip:   s=>req(`/api/manual-crop/${s}/strip`),
  narrGet:       s=>req(`/api/narration/${s}`),
  narrText:      (s,pid,text)=>req(`/api/narration/${s}/text`,jbody({panel_id:pid,text})),
  narrReset:     (s,pid)=>req(`/api/narration/${s}/reset`,jbody({panel_id:pid})),
  narrStyle:     (s,style)=>req(`/api/narration/${s}/style`,jbody({style})),

/* ---------------- toasts / status pill ---------------- */
function toast(msg,kind="ok"){
  const t=document.createElement("div");t.className=`toast ${kind}`;t.textContent=msg;
  $("#toasts").append(t);
  setTimeout(()=>{t.classList.add("out");setTimeout(()=>t.remove(),260)},3600);
}
function setPill(status,txt){
  $("#statusPill").dataset.status=status;
  $("#statusTxt").textContent=txt||status;

/* ---------------- job watching (real progress, no fakery) ---------------- */
const watchers=new Map();
function watch(jobId,onChange){
  if(watchers.has(jobId))return;
  const poll=async()=>{
    try{
      const job=await api.job(jobId);
      setPill(job.status, job.status==="running" ? (job.stage||"running").replace(/_/g," ") : job.status);
      onChange&&onChange(job);
      if(TERMINAL.includes(job.status)){
        clearInterval(watchers.get(jobId));watchers.delete(jobId);
        if(job.status==="completed")toast(`Job ${jobId.slice(0,6)} completed`);
        if(job.status==="failed")toast(job.error||"Job failed","err");
      }
    }catch(_){/* transient; keep polling */}
  };
  watchers.set(jobId,setInterval(poll,1000));poll();
}

/* Upload one or more strips WITHOUT auto-running; they land in the queue

async function queueFiles(files){
  const accepted=[...files].filter(f=>/\.(png|jpe?g|webp)$/i.test(f.name));
  if(!accepted.length){toast("Only PNG / JPG / WebP images are supported","err");return}
  toast(`Uploading ${accepted.length} strip${accepted.length>1?"s":""}…`);
  let ok=0,failed=0;
  for(const f of accepted){
    try{
      const{job_id}=await api.upload(f,false);     /* run=0 — no auto-segmentation */
      setSession(job_id,f.name);
      if(!store.queue.some(q=>q.session===job_id)){
        store.queue.unshift({session:job_id,name:f.name,added:Date.now()/1000});
        store.queue=store.queue.slice(0,20);save();
      }
      ok++;
    }catch(e){failed++;toast(`${f.name}: ${e.message}`,"err")}
  }
  if(ok){toast(`Added ${ok} strip${ok>1?"s":""} — press Run when ready`,"ok");render();}

async function runQueued(session){
  try{
    /* Continue the most recent sequence automatically: find the latest
       session (excluding this one) that already has panels, so this
       strip's panels are ADDED after them in Panel Review instead of
       replacing the previous strip's panels. */
    let contFrom=null;
    try{
      const r=await api.projects();
      const withPanels=(r.projects||[]).filter(p=>p.id!==session&&p.panels>0)
        .sort((a,b)=>(b.updated_at||b.created_at||0)-(a.updated_at||a.created_at||0));
      if(withPanels.length)contFrom=withPanels[0].id;
    }catch(_){}
    toast(contFrom?"Continuing sequence — panels will be added after the previous strips":"Automation started — new sequence");
    const{job_id}=await api.run(runBody(session,contFrom));
    store.genJob[session]=job_id;
    store.queue=store.queue.filter(q=>q.session!==session);save();
    watch(job_id);
    nav("generate",session);
  }catch(e){toast(e.message,"err")}
}
async function runAllQueued(){
  const snap=[...store.queue];
  if(!snap.length){toast("Queue is empty","warn");return}
  let ok=0,failed=0,prev=null;
  toast(`Running ${snap.length} strips as one sequence…`);
  for(const q of snap){
    try{
      /* chain each queued strip onto the previous one so the sequence
         builds up: strip1 -> strip2(continue strip1) -> strip3(continue
         strip2)... serialized: /api/run requires the previous strip to
         already have panels, so wait for each job to finish first. */
      const{job_id}=await api.run(runBody(q.session,prev));
      store.genJob[q.session]=job_id;watch(job_id);ok++;prev=q.session;
      /* wait for segmentation (panels.json) before continuing the chain */
      if(snap.length>1){
        const t0=Date.now();
        for(;;){
          let j=null;
          try{j=await api.job(job_id)}catch(_){break}
          if(!j||["completed","failed","cancelled"].includes(j.status))break;
          if(Date.now()-t0>15*60*1000){toast(`${q.session.slice(0,6)} still running — not chaining the rest automatically`,"warn");prev=null;break}
          await new Promise(r=>setTimeout(r,1500));
        }
      }
    }catch(e){failed++;toast(`${q.session.slice(0,6)}: ${e.message}`,"err")}
  }
  store.queue=[];save();
  if(ok)toast(`Started automation on ${ok} session${ok>1?"s":""}`,"ok");
  render();
}

/* Resolve the session a view should act on. Bounces are painful, so when
   nothing is open we auto-select the most recently touched project instead. */
async function requireSession(hint){
  if(hint)return hint;
  if(store.session)return store.session;
  try{
    const r=await api.projects();
    const list=(r.projects||[]).filter(p=>p.id)
      .sort((a,b)=>(b.updated_at||b.created_at||0)-(a.updated_at||a.created_at||0));
    if(list.length){

      return store.session;
    }
  }catch(_){}

function wirePanelGrid(session,panels,openInspect,commitOrder){

      e.preventDefault();

      if(!n)return;
      e.key==="ArrowRight"?grid.insertBefore(c,n.nextSibling):grid.insertBefore(c,n);
      c.focus();commitOrder();
    }
  });

const MC_CLEANUPS=[];
async function vManualCrop(session){
  while(MC_CLEANUPS.length){try{MC_CLEANUPS.pop()()}catch(_){}}
  session=await requireSession(session);if(!session)return studioEmpty("Manual Crop");
  setSession(session);
  let boundaries=[], selectedIdx=-1, naturalW=0, naturalH=0, history=[], historyIdx=-1, guides=[], stripUrl="", rowVariances=null;
  let saveTimer, dragIdx=-1, dragStartY=0, dragStartVal=0;
  /* NOTE: do NOT shadow the global $ (querySelector-based) with a
     getElementById variant here — every call in this view uses
     "#id"-prefixed selectors, and $("#id") under getElementById
     silently returns null (the wiring guard then bails, killing
     dblclick/drag/save). The global $ at the top of the file is the

  function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}

    const el=$("#mcYDisplay");
    if(el) el.textContent=selectedIdx>=0?`Y: ${boundaries[selectedIdx]}px`:"Y: —";
  }
  async function computeRowVariances(){
    if(!naturalW||!img.complete) return;
    const cvs=document.createElement("canvas");
    cvs.width=naturalW; cvs.height=naturalH;
    const ctx=cvs.getContext("2d");
    ctx.drawImage(img,0,0);
    const data=ctx.getImageData(0,0,naturalW,naturalH).data;
    rowVariances=new Float32Array(naturalH);
    for(let y=0;y<naturalH;y++){
      let sum=0,sumSq=0,count=0;
      for(let x=0;x<naturalW;x++){
        const i=(y*naturalW+x)*4;
        const gray=data[i]*0.299+data[i+1]*0.587+data[i+2]*0.114;
        sum+=gray; sumSq+=gray*gray; count++;
      }
      const mean=sum/count;
      rowVariances[y]=sumSq/count-mean*mean;
    }
  }
  function findNearestGutter(y,tol=15){
    if(!rowVariances) return y;
    let best=y, bestVar=rowVariances[y];
    for(let d=1;d<=tol;d++){
      for(const candidate of [y-d,y+d]){
        if(candidate<0||candidate>=naturalH) continue;
        if(rowVariances[candidate]<bestVar){
          bestVar=rowVariances[candidate];
          best=candidate;
        }
      }
    }
    return best;
  }
  
  function pushHistory(){
    history=history.slice(0,historyIdx+1);
    history.push(JSON.stringify(boundaries));
    historyIdx=history.length-1;
  }
  function undo(){if(historyIdx>0){historyIdx--;boundaries=JSON.parse(history[historyIdx]);render();saveDebounced();}}
  function redo(){if(historyIdx<history.length-1){historyIdx++;boundaries=JSON.parse(history[historyIdx]);render();saveDebounced();}}
  
  function saveDebounced(){
    clearTimeout(saveTimer);
    const st=$("#mcStatus"); if(st) st.textContent="Saving...";
    saveTimer=setTimeout(async()=>{
      try{
        const userBounds=boundaries.slice(1,-1);
        await api.manualSave(session, userBounds);
        const st=$("#mcStatus"); if(st) st.textContent="Saved ✓";
      }catch(e){const st=$("#mcStatus"); if(st) st.textContent="Save failed";toast(e.message,"err");}
    },300);
  }
  
  function render(){
    const canvas=$("#mcCanvas"), wrap=$("#mcImgWrap"), img=$("#mcImg"), bdiv=$("#mcBoundaries"), pre=$("#mcPreviews");
    if(!wrap||!img||!bdiv||!pre||!naturalW) return;
    // wrap.clientWidth already includes the zoom (setZoom sets its width%);
    // do NOT multiply by zoom again.
    const scale=wrap.clientWidth/naturalW;
    const hint=$("#mcHint");
    if(hint)hint.style.display=boundaries.length>2?"none":"block";
    bdiv.innerHTML="";
    boundaries.forEach((y,i)=>{
      const top=y*scale;
      const d=document.createElement("div");
      d.className="boundary"+(i===selectedIdx?" selected":"");
      d.style.top=(top-1)+"px";
      d.dataset.idx=i;
      const g=document.createElement("div");
      g.className="boundary-grip";
      g.textContent="⋮⋮";
      g.dataset.idx=i;
      d.appendChild(g);
      const h=document.createElement("div");
      h.className="boundary-handle";
      h.dataset.idx=i;
      d.appendChild(h);
      bdiv.appendChild(d);
    });
    if(dragIdx>=0&&boundaries[dragIdx]!==undefined){
      const tip=document.createElement("div");
      tip.className="mc-ytip";
      tip.style.top=(boundaries[dragIdx]*scale-22)+"px";
      tip.textContent=`Y: ${boundaries[dragIdx]}px`;
      bdiv.appendChild(tip);
    }
    if(guides.length){
      guides.forEach(y=>{
        const g=document.createElement("div");
        g.style.cssText=`position:absolute;left:0;right:0;height:1px;top:${y*scale}px;background:repeating-linear-gradient(to right,var(--txt3) 0 4px,transparent 4px 8px);opacity:.5;pointer-events:none;z-index:1;`;
        bdiv.appendChild(g);
      });
    }
    pre.innerHTML="";
    if(img.complete&&naturalW){
      pairwise(boundaries).forEach(([y0,y1],i)=>{
        if(y1-y0<1) return;
        const h=y1-y0;
        const thumbW=clamp(Math.round((h/120)*120),60,240);
        const thumbH=120;
        const cvs=document.createElement("canvas");
        cvs.width=thumbW; cvs.height=thumbH;
        const ctx=cvs.getContext("2d");
        ctx.drawImage(img,0,y0,naturalW,h,0,0,thumbW,thumbH);
        if(h<30){
          ctx.fillStyle="rgba(255,93,93,.25)";
          ctx.fillRect(0,0,thumbW,thumbH);
          ctx.fillStyle="#FF5D5D";
          ctx.font="bold 10px sans-serif";
          ctx.fillText("thin",4,12);
        }
        const wrap=document.createElement("div");
        wrap.className="preview-thumb";
        wrap.appendChild(cvs);
        const lbl=document.createElement("div");
        lbl.style.cssText="font-size:11px;color:var(--txt2);padding:4px 6px;text-align:right;font-family:var(--mono)";
        lbl.textContent=`${y0}–${y1} px`;
        wrap.appendChild(lbl);
        pre.appendChild(wrap);
      });
    }
    updateYDisplay();
  }
  
  function addBoundary(y){
    if(!naturalH) return;
    y=clamp(Math.round(y),0,naturalH);
    if($("#mcSnap")&&$("#mcSnap").checked) y=findNearestGutter(y);
    boundaries.push(y);
    boundaries.sort((a,b)=>a-b);

  }
  function deleteSelected(){
    if(selectedIdx<=0||selectedIdx>=boundaries.length-1)return;

    selectedIdx=-1;
    pushHistory();
    render();saveDebounced();
  }
  
  // init data
  try{
    const state=await api.manualState(session);
    const raw=state.boundaries||[];
    const g=await api.manualGuides(session);
    guides=g.guides||[];

    }else{

    }

  try{
    // manualStrip returns a FileResponse (image bytes), NOT JSON — the api
    // helper hands back the raw Response, so use the route URL directly.
    stripUrl=`/api/manual-crop/${session}/strip`;

    naturalW=tmpImg.naturalWidth; naturalH=tmpImg.naturalHeight;

    boundaries=[...new Set(boundaries)].sort((a,b)=>a-b);
    pushHistory();
  }catch(e){toast(e.message,"err");return}
  
  render();
  
  viewEl.innerHTML=`
  <div class="manual-wrap">
    <div class="manual-stage">
      <div class="manual-toolbar">
        <span class="lbl">Manual Crop</span>
        <button class="btn sm" id="mcAdd">+ Add Boundary</button>
        <button class="btn sm" id="mcDel">Delete Boundary</button>
        <button class="btn sm" id="mcUndo">Undo</button>
        <button class="btn sm" id="mcRedo">Redo</button>
        <button class="btn sm" id="mcZoomOut">−</button>
        <span class="lbl" id="mcZoomLbl">100%</span>
        <button class="btn sm" id="mcZoomIn">+</button>
        <button class="btn sm" id="mcFit">Fit</button>
        <button class="btn sm" id="mcAutoCrop" title="Run ONLY the AI panel segmentation (no narration, no render) and load its detected edges as editable boundaries">⚡ Auto Crop</button>
        <button class="btn sm" id="mcLoadGuides" title="Load automatic boundaries as guides">Load Guides</button>
        <label class="lbl" style="display:flex;align-items:center;gap:6px;cursor:pointer" title="Snap boundaries to nearby gutters">
          <input type="checkbox" id="mcSnap"> Snap
        </label>
        <span class="lbl" id="mcYDisplay">Y: —</span>
        <input type="number" id="mcYInput" style="width:70px;background:var(--ink3);color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:2px 6px;font-family:var(--mono);font-size:12px" placeholder="Y px">
        <span class="lbl" id="mcStatus">Ready</span>
        <div style="flex:1"></div>
        <button class="btn acc" id="mcGenerate">Generate Panels</button>
        <button class="btn ghost sm" id="mcReset">Reset to Automatic</button>
      </div>
      <div class="manual-canvas" id="mcCanvas">
        <div class="manual-img-wrap" id="mcImgWrap">
          <img id="mcImg" src="${esc(stripUrl)}" alt="strip" crossorigin="anonymous">
          <div id="mcBoundaries"></div>
        </div>
        <div id="mcHint" style="position:absolute;left:50%;transform:translateX(-50%);bottom:14px;background:var(--ink4);border:1px solid var(--line2);border-radius:var(--r);padding:8px 14px;font-size:12px;color:var(--txt2);pointer-events:none;z-index:5">

      <div id="mcPreviews"></div>
    </div>
  </div>`;
  
  const canvas=$("#mcCanvas"), wrap=$("#mcImgWrap"), img=$("#mcImg"), bdiv=$("#mcBoundaries"), pre=$("#mcPreviews"), status=$("#mcStatus");
  // The async init above awaits network fetches; the user may have

  // ("Cannot set properties of null").
  if(!canvas||!wrap||!img||!bdiv||!pre){

  }
  let currentZoom=1;
  function setZoom(z){

    render();
  }
  img.onload=()=>{naturalW=img.naturalWidth;naturalH=img.naturalHeight;computeRowVariances();render();};
  img.onerror=()=>{status.textContent="strip failed to load";toast("strip image failed to load — re-upload or check the session","err")};
  if(img.complete&&img.naturalWidth){
    // cached image: onload may never fire again
    naturalW=img.naturalWidth;naturalH=img.naturalHeight;
    computeRowVariances();
  }
  
  bdiv.addEventListener("mousedown",e=>{
    const handle=e.target.closest(".boundary-handle,.boundary-grip,.boundary");
    if(!handle) return;
    e.preventDefault();
    dragIdx=+handle.dataset.idx;

  // Document-level listeners persist across views; entering this view

  document.addEventListener("mousemove",e=>{
    if(!alive.ok||dragIdx<0||!naturalW) return;
    const scale=wrap.clientWidth/naturalW;   // wrap width already includes zoom
    const dy=e.clientY-dragStartY;
    let newY=Math.round(dragStartVal+dy/scale);
    newY=clamp(newY,0,naturalH);

    if($("#mcSnap")&&$("#mcSnap").checked) newY=findNearestGutter(newY);
    boundaries[dragIdx]=newY;
    render();
  });
  document.addEventListener("mouseup",()=>{

  });
  // Touch support — same math as mouse, for tablets/touchscreens
  bdiv.addEventListener("touchstart",e=>{
    const t=e.target.closest(".boundary-handle,.boundary-grip,.boundary");
    if(!t) return;
    e.preventDefault();
    dragIdx=+t.dataset.idx;
    selectedIdx=dragIdx;
    dragStartY=e.touches[0].clientY;
    dragStartVal=boundaries[dragIdx];
    render();
  },{passive:false});
  document.addEventListener("touchmove",e=>{
    if(!alive.ok||dragIdx<0||!naturalW) return;
    e.preventDefault();
    const scale=wrap.clientWidth/naturalW;
    const dy=e.touches[0].clientY-dragStartY;
    let newY=Math.round(dragStartVal+dy/scale);
    newY=clamp(newY,0,naturalH);
    if(dragIdx>0) newY=Math.max(newY,boundaries[dragIdx-1]+1);
    if(dragIdx<boundaries.length-1) newY=Math.min(newY,boundaries[dragIdx+1]-1);
    if($("#mcSnap")&&$("#mcSnap").checked) newY=findNearestGutter(newY);
    boundaries[dragIdx]=newY;
    render();
  },{passive:false});
  document.addEventListener("touchend",()=>{
    if(!alive.ok) return;
    if(dragIdx>=0){dragIdx=-1;pushHistory();saveDebounced();render();}
  });
  
  canvas.addEventListener("dblclick",e=>{
    if(e.target.closest(".boundary-handle,.boundary-grip,.boundary")) return;
    const rect=wrap.getBoundingClientRect();
    const scaleY=wrap.clientHeight/naturalH;
    const y=Math.round((e.clientY-rect.top)/scaleY);
    addBoundary(y);
  });
  
  document.addEventListener("keydown",e=>{
    if(!alive.ok) return;
    if(selectedIdx<0||!naturalH) return;
    const step=e.shiftKey?10:1;
    if(e.key==="ArrowUp"){
      e.preventDefault();
      boundaries[selectedIdx]=Math.max(0,boundaries[selectedIdx]-step);
      if(selectedIdx>0) boundaries[selectedIdx]=Math.max(boundaries[selectedIdx],boundaries[selectedIdx-1]+1);
      render();saveDebounced();
    }else if(e.key==="ArrowDown"){
      e.preventDefault();
      boundaries[selectedIdx]=Math.min(naturalH,boundaries[selectedIdx]+step);
      if(selectedIdx<boundaries.length-1) boundaries[selectedIdx]=Math.min(boundaries[selectedIdx],boundaries[selectedIdx+1]-1);
      render();saveDebounced();
    }else if(e.key==="Delete"||e.key==="Backspace"){
      e.preventDefault();deleteSelected();
    }else if((e.ctrlKey||e.metaKey)&&e.key==="z"){
      e.preventDefault();undo();
    }else if((e.ctrlKey||e.metaKey)&&e.key==="y"){
      e.preventDefault();redo();
    }
  });
  
  $("#mcAdd").onclick=()=>addBoundary(naturalH/2);
  $("#mcDel").onclick=deleteSelected;
  $("#mcUndo").onclick=undo;
  $("#mcRedo").onclick=redo;
  $("#mcZoomIn").onclick=()=>setZoom(currentZoom+0.25);
  $("#mcZoomOut").onclick=()=>setZoom(currentZoom-0.25);
  $("#mcFit").onclick=()=>setZoom(1);
  $("#mcLoadGuides").onclick=async()=>{
    try{
      const g=await api.manualGuides(session);
      const raw=g.guides||[];
      if(!raw.length){toast("No automatic guides found","warn");return}
      boundaries=[0,...raw.filter(b=>b>0&&b<naturalH),naturalH];
      boundaries=[...new Set(boundaries)].sort((a,b)=>a-b);

      pushHistory();render();saveDebounced();
      toast("Guides loaded");
    }catch(e){toast(e.message,"err")}
  };
  $("#mcAutoCrop").onclick=async()=>{

      const r=await req(`/api/manual-crop/${session}/auto-crop`,{method:"POST",body:JSON.stringify({
        backend:store.settings.backend==="none"?"none":store.settings.backend,
        api_key:store.settings.api_key||"",model:store.settings.model||"",endpoint:store.settings.endpoint||""
      }),headers:{"Content-Type":"application/json"}});
      const jobId=r.job_id;

      await new Promise((resolve,reject)=>{
        const poll=setInterval(async()=>{
          try{
            const j=await api.job(jobId);

            }
          }catch(e){clearInterval(poll);reject(e)}
        },1200);
      });

      if(!raw.length){toast("Auto crop finished but detected no edges","warn")}
      else{
        boundaries=[0,...raw,naturalH];
        boundaries=[...new Set(boundaries)].sort((a,b)=>a-b);
        selectedIdx=-1;
        pushHistory();render();saveDebounced();
        toast(`Auto crop done — ${boundaries.length-1} panels detected; adjust freely`,"ok");
      }
      status.textContent="Ready";

      toast(e.message,"err");
    }finally{btn.disabled=false}
  };
  $("#mcSnap").onchange=render;
  $("#mcYInput").onchange=()=>{

    if(selectedIdx>0) boundaries[selectedIdx]=Math.max(boundaries[selectedIdx],boundaries[selectedIdx-1]+1);

    try{

        toast(`Generated ${R.active} panels — valid:${v.accepted} suspicious:${v.suspicious} rejected:${v.rejected} duplicates:${v.duplicates}`,"ok");
        const bad=(v.verdicts||[]).filter(x=>x.quality!=="normal");
        if(bad.length){
          const list=bad.map(x=>`<li><b>${esc(x.panel_id)}</b>: ${esc(x.quality)} — ${esc((x.reasons||[]).join("; "))}
            <br><button class="btn sm bad" data-del="${esc(x.panel_id)}">Delete</button>
            <button class="btn sm ok" data-keep="${esc(x.panel_id)}">Keep Anyway</button></li>`).join("");
          viewEl.insertAdjacentHTML("beforeend",`<div id="mcReview" style="position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:99">
            <div class="panel" style="max-width:520px;width:90%;max-height:80vh;overflow:auto">
              <div class="lbl">Post-crop validation</div>
              <p style="margin-top:8px">Some panels need attention before continuing.</p>

              <div style="display:flex;gap:8px;justify-content:flex-end">
                <button class="btn acc" id="mcReviewOk">Continue to Panels</button>

            </div>

          $("#mcReviewOk").onclick=async()=>{
            for(const btn of $$("#mcReview [data-del]")){

    }

function jobFor(session){                 /* latest generate job, else the segment job */
  const id=store.genJob[session];
  return id?api.job(id).catch(()=>api.job(session)):api.job(session);
}
async function watchActive(session){
  const paintLive=async()=>{try{paint(await jobFor(session))}catch(_){}};
  await paintLive();
  genStop=setInterval(async()=>{
    if(parseHash().view!=="generate"){clearInterval(genStop);genStop=null;return}
    await paintLive();
  },1200);

async function paint(jobP){
  const job=await Promise.resolve(jobP); if(!job||!$("#steps"))return;
  const idx=STAGES.findIndex(([id])=>id===job.stage);
  $$("#steps .step").forEach((el,i)=>{
    el.className="step "+(job.status==="completed"||i<idx||(i===idx&&job.status!=="running")?"done"
      :i===idx&&job.status==="failed"?"failed"
      :i===idx?"running":"");
    el.querySelector(".mark").textContent=job.status==="completed"||i<idx||(i===idx&&TERMINAL.includes(job.status)&&job.status!=="failed")?"✓"
      :(i===idx&&job.status==="failed")?"✕":(i===idx?"●":"·");
  });
  $("#pbar").style.width=(job.progress||0)+"%";
  $("#pPct").textContent=(job.progress||0)+"% · "+(job.stage?job.stage.replace(/_/g," "):job.status);
  setPill(job.status, job.status==="running"?(job.stage||"running").replace(/_/g," "):job.status);
  /* context buttons */
  const running=job.status==="running", failed=job.status==="failed", done=job.status==="completed";
  const renderErr=job.outputs&&job.outputs.render_error;
  $("#genBtns").innerHTML=
    running?`<button class="btn danger" id="bCancel">Cancel</button>`:
    failed ?`<button class="btn acc" id="bRun">Retry automation</button>${job.stage?`<button class="btn" id="bResume" title="Resume from the failed stage; earlier stages are skipped (cached outputs on disk are reused)">Retry from ${job.stage.replace(/_/g," ")}</button>`:""}`:
    done&&!renderErr?`<button class="btn" id="bRerun">Re-run</button><button class="btn acc" id="bRev">Review →</button>`:
    done&&renderErr?`<button class="btn acc" id="bResumeRender" title="Only re-runs the render stage">Retry render</button><button class="btn" id="bRev">Review →</button>`:
            `<button class="btn acc" id="bRun">Run Automation</button><button class="btn" id="bStep" title="Run ONE stage at a time with checkpoints, inspection and retry per step">□□ Step-by-Step</button>`;
  const s=store.session;
  const run=async(startStage,continueFrom)=>{
    try{
      toast(startStage?`Resuming from ${startStage.replace(/_/g," ")}`:continueFrom?`Continuing sequence — merging previous strips`:"Automation started");
      const{job_id}=await api.run({session:s,order:store.order[s]||null,
        tts:store.settings.tts,voice:store.settings.voice,style:store.settings.style,
        backend:store.settings.backend,api_key:store.settings.api_key,
        model:store.settings.model,endpoint:store.settings.endpoint,
        cf_account_id:store.settings.cf_account_id,
        start_stage:startStage||null,
        continue_from:continueFrom||null});
      store.genJob[s]=job_id;save();watch(job_id);paintLiveSoon();
    }catch(e){toast(e.message,"err")}
  };
  const paintLiveSoon=()=>setTimeout(()=>paint(api.job(store.genJob[s]||s)),400);
  $("#bRun")&&($("#bRun").onclick=()=>{
    const cont=$("#genContinue")?$("#genContinue").value:null;
    run(null, cont||null);
  });
  $("#bStep")&&($("#bStep").onclick=async()=>{
    /* Step-by-Step: run the first stage, then continue in the Pipeline
       view (checkpoints + per-step Run/Retry/Reset). */
    try{
      const r=await api.pipeRunStep(s,"validate_config");
      toast("Step 1 ran — continuing in the Pipeline view","ok");
      nav("pipeline",s);
    }catch(e){toast(e.message,"err")}
  });
  $("#bResume")&&($("#bResume").onclick=()=>run(job.stage,null));
  $("#bResumeRender")&&($("#bResumeRender").onclick=()=>run("render_video",null));
  $("#bRerun")&&($("#bRerun").onclick=()=>run(null,null));
  $("#bCancel")&&($("#bCancel").onclick=async()=>{try{await api.cancel(store.genJob[s]||s);toast("Cancel requested","warn")}catch(e){toast(e.message,"err")}});
  $("#bRev")&&($("#bRev").onclick=()=>nav("review",s));
  /* populate the continuation picker (sessions with panels, newest first) */
  const contSel=$("#genContinue");
  if(contSel){
    api.projects().then(r=>{
      const opts=(r.projects||[]).filter(p=>p.id!==s&&p.panels>0);
      if(!opts.length)return;
      opts.forEach(p=>{
        const o=document.createElement("option");
        o.value=p.id;
        o.textContent=`${store.names?.[p.id]||p.id} · ${p.panels} panels`;
        contSel.appendChild(o);
      });
    }).catch(()=>{});
  }
  /* render-soft-failure banner */
  const errSlot=$("#errSlot");
  if(errSlot){
    errSlot.innerHTML=
      job.status==="failed"&&job.error?`<div class="errbox">${esc(job.error)}</div>`:
      renderErr?`<div class="errbox" style="border-color:var(--amber)">Video not rendered: ${esc(renderErr)}. Everything else is ready — retry the render above.</div>`:"";
  }
}

    const st=d.state||{};
    const steps=d.steps||[];
    const running=d.running;
    const sel=`step ${st.current_step||1}/${steps.length} · ${st.status||"idle"}`
      +(st.mode?` · ${st.mode==="step"?"step-by-step":"automation"} mode`:"");
    $("#pipeSub").textContent=sel;
    /* step rows */
    const rows=steps.map(s=>{
      const e=(st.steps||[]).find(x=>x.step===s.step);
      let status=e?e.status:"pending";
      if(running&&running.stage===s.pipeline_name)status="running";
      const stale=(d.stale||[]).includes(s.step);
      const dur=e?`${(e.duration_s||0).toFixed(1)}s`:"";
      const warn=(e&&e.warnings&&e.warnings.length)?` ⚠ ${e.warnings.length}`:"";
      const sub=[dur,status+(stale?" · stale":""),warn].filter(Boolean).join(" · ");
      return `<div class="pstep" data-st="${status}" data-step="${s.step}" data-stage="${s.pipeline_name}">
        <div class="pico">${PIPE_ICONS[status]||"○"}</div>
        <div class="pmain"><div class="pname">${s.step}. ${esc(s.label)}</div>
        <div class="psub">${esc(sub)}</div></div>
        <div class="pacts">
          ${status==="failed"||stale?`<button class="btn sm" data-rerun="${s.pipeline_name}">Rerun</button>`:""}
        </div>
      </div>`;
    }).join("");
    $("#pipeSteps").innerHTML=`<div class="lbl">pipeline state</div>
      <div style="margin:10px 0 12px">${rows}</div>`;
    /* action buttons */
    const nextStep=steps.find(s=>s.step===(st.current_step||1));
    const btns=[];
    if(running){
      btns.push(`<button class="btn sm" disabled>${running.status}… ${esc((running.stage||"").replace(/_/g," "))}</button>`);
    }else{
      if(nextStep)btns.push(`<button class="btn sm acc" id="pRunNext">Run Step ${nextStep.step} · ${esc(nextStep.label)}</button>`);
      btns.push(`<button class="btn sm" id="pRunAll">Run to End (Automation)</button>`);
    }
    $("#pipeBtns").innerHTML=btns.join("");
    if($("#pRunNext"))$("#pRunNext").onclick=()=>pipeRun(session,nextStep.pipeline_name);
    if($("#pRunAll"))$("#pRunAll").onclick=()=>pipeRunUntil(session,null);
    /* step clicks -> inspector */
    $$(".pstep",viewEl).forEach(el=>{
      el.onclick=async e=>{
        if(e.target.closest("[data-rerun]"))return;
        $$(".pstep",viewEl).forEach(x=>x.classList.remove("selected"));
        el.classList.add("selected");
        await pipeDetail(session,parseInt(el.dataset.step,10));
      };
    });
    $$("[data-rerun]",viewEl).forEach(b=>b.onclick=async e=>{
      e.stopPropagation();
      pipeRun(session,b.dataset.rerun);
    });
    await pipeConsoleDraw(session);
  };
  draw();
  clearInterval(pipeTimer);
  pipeTimer=setInterval(()=>{if(parseHash().view==="pipeline")draw();else clearInterval(pipeTimer)},1500);
}

async function pipeDetail(session,stepNo){

    <div style="margin-top:10px;display:grid;gap:4px;font-size:12.5px">

    </div>`;

  log.innerHTML=evs.length?evs.map(ev=>`<div class="pev s-${esc(ev.severity)}"><span class="t">${fmtT(ev.t)}</span><span>${esc(ev.severity)}</span><span>${esc(ev.message)}${ev.duration_s!=null?` (${ev.duration_s.toFixed(1)}s)`:""}</span></div>`).join(""):"<p style='color:var(--txt3)'>no events</p>";
  if($("#pdRetry"))$("#pdRetry").onclick=()=>pipeRun(session,d.step.pipeline_name);

  };
  if($("#pdRerun"))$("#pdRerun").onclick=()=>pipeRunUntil(session,null,d.step.pipeline_name);
  if($("#pdResetFrom"))$("#pdResetFrom").onclick=async()=>{
    try{
      const r=await api.pipeResetFrom(session,d.step.pipeline_name);

async function pipeConsoleDraw(session){

function startResize(ev,clip,handle){
  ev.stopPropagation();
  const pid=clip.dataset.pid,total=tlTotal();
  const e=ED.project.edited_timeline.find(x=>x.panel_id===pid);
  const startX=ev.clientX, dur0=e.duration_seconds, pxPerSec=clip.offsetWidth/dur0;
  const move=m=>{
    const d=(m.clientX-startX)/pxPerSec*(handle.dataset.hd==="r"?1:-1);
    const nd=Math.max(0.5,dur0+d);
    e.duration_seconds=nd;clip.style.width=(nd/total*100)+"%";
    clip.querySelector(".cm").textContent=`${pid} · ${nd.toFixed(1)}s`;
  };
  const up=()=>{
    removeEventListener("pointermove",move);removeEventListener("pointerup",up);
    api.edPost(ED.session,"duration",{panel_id:pid,duration:Math.round(e.duration_seconds*100)/100})
      .then(refreshEd).catch(err=>toast(err.message,"err"));
  };
  addEventListener("pointermove",move);addEventListener("pointerup",up);
}

   VIEW — Logs (structured, filterable, copy/download)

let logTimer=null;
async function vLogs(){
  let jobs=store.recent.concat(Object.values(store.genJob||{}).map(id=>({session:id})))
    .filter((v,i,a)=>a.findIndex(x=>x.session===v.session)===i);
  if(!jobs.length){
    /* localStorage empty/stale or browser refreshed — the dropdown would be
       empty and the `if(!id)return` guard would silently render nothing. Fall
       back to the server's project list (updated_at desc, limit 20). */
    try{
      const r=await api.projects();
      jobs=(r.projects||[]).filter(p=>p.id)
        .sort((a,b)=>(b.updated_at||b.created_at||0)-(a.updated_at||a.created_at||0))
        .slice(0,20).map(p=>({session:p.id}));
    }catch(_){/* server unreachable — dropdown stays empty, draw() shows the fetch error */}
  }
  jobs=jobs.slice(0,20);
  viewEl.innerHTML=`
  <div class="lbl">debug · structured job logs</div>
  <h2 class="h-disp" style="font-size:28px;margin:4px 0 16px">Logs</h2>
  <div class="logbar">
    <select id="logJob" style="padding:7px 10px;background:var(--ink3);color:var(--txt);border:1px solid var(--line2);border-radius:8px">
      ${jobs.map(j=>`<option value="${esc(j.session)}">${esc((store.names&&store.names[j.session])||j.session)}</option>`).join("")}
    </select>
    ${["All","INFO","WARNING","ERROR"].map((l,i)=>`<span class="chip ${i===0?"on":""}" data-l="${l}">${l}</span>`).join("")}
    <input id="logQ" placeholder="filter messages…" style="padding:7px 11px;background:var(--ink3);color:var(--txt);border:1px solid var(--line2);border-radius:8px">
    <button class="btn sm" id="logCopy">Copy</button>
    <button class="btn sm" id="logDl">Download</button>
  </div>
  <ol class="loglist" id="logList" aria-live="polite"></ol>`;
  let lvl="All",q="";
  const draw=async()=>{
    const id=$("#logJob").value;if(!id)return;
    try{
      const job=await api.jobLogs(id);
      const rows=(job.logs||[]).filter(r=>(lvl==="All"||r.level===lvl)&&(!q||(r.msg||"").toLowerCase().includes(q)));
      $("#logList").innerHTML=rows.map(r=>`
        <li class="${(r.level||"info").toLowerCase()}">
          <time>${new Date((r.t||0)*1000).toTimeString().slice(0,8)}</time>
          <span class="lv">${esc(r.level||"INFO")}</span>
          <span class="st">${esc(r.stage||"")}</span>
          <span class="msg">${esc(r.msg||"")}</span></li>`).join("")
        ||`<li><time></time><span class="lv"></span><span class="st"></span><span class="msg" style="color:var(--txt3)">no log lines</span></li>`;
      $("#logList").scrollTop=$("#logList").scrollHeight;
    }catch(e){
      // 404 = the job no longer exists in this server process (it was
      // created before a restart). Stop the 2s poll loop instead of
      // hammering the endpoint forever, and say so clearly.
      // "Failed to fetch" = no server listening at all (uvicorn down).
      const msg=e.message||"";
      const gone=/404|not found/i.test(msg);
      const down=/failed to fetch|networkerror|load failed/i.test(msg);
      $("#logList").innerHTML=`<li><span class="msg" style="color:var(--coral)">${esc(gone?"job no longer exists on the server (it was restarted?) — polling stopped":down?"cannot reach the server — is uvicorn running on :8000? (start it with: uvicorn webapp.main:app --port 8000)":msg)}</span></li>`;
      if(gone)clearInterval(logTimer);
    }
  };
  $("#logJob").onchange=draw;
  $$(".logbar .chip").forEach(c=>c.onclick=()=>{$$(".logbar .chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");lvl=c.dataset.l;draw()});
  $("#logQ").oninput=e=>{q=e.target.value.toLowerCase();draw()};
  $("#logCopy").onclick=async()=>{await navigator.clipboard.writeText($$("#logList .msg").map(m=>m.textContent).join("\n"));toast("Logs copied")};
  $("#logDl").onclick=()=>{
    const blob=new Blob([$$("#logList li").map(li=>li.textContent.trim()).join("\n")],{type:"text/plain"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${$("#logJob").value}.log`;a.click();
  };
  draw();clearInterval(logTimer);logTimer=setInterval(()=>{if(parseHash().view==="logs")draw();else clearInterval(logTimer)},2000);
}
